---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-management-volume
spec:
  interval: 1h
  path: ./kubernetes/apps/network-management/network-management-volume/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network-management
  # Must stay false, for the same reason as media-volume and
  # home-automation-volume: openebs-hostpath is WaitForFirstConsumer, so these
  # PVCs stay Pending until a pod mounts them. With wait: true this
  # Kustomization never goes Ready and every app that depends on it blocks
  # forever.
  wait: false
