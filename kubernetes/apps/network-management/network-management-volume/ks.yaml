---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-management-volume
spec:
  interval: 1h
  path: ./kubernetes/apps/network-management/network-management-volume/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network-management
  wait: true
