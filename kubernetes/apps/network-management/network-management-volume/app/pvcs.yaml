---
# Declared here rather than in the HelmRelease so the data outlives any
# release, matching media-volume and home-automation-volume.
#
# openebs-hostpath has ALLOWVOLUMEEXPANSION false — neither of these can be
# grown later, so they are sized with room. The controller's data directory
# was 604M on docker at migration time; 5Gi is the size the upstream Helm
# chart also suggests.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omada-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
---
# Separate from the data volume so log growth can never fill the thing that
# holds the MongoDB database. Was 75M on docker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omada-logs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 2Gi
---
# The v6 controller's data directory. A SEPARATE volume from omada-data on
# purpose: Omada cannot be downgraded — moving a database to a newer
# controller and back "will break the database and require a full reinstall"
# — so the v5→v6 upgrade was done as backup/restore onto a fresh volume
# rather than an in-place MongoDB 3.6→8 migration. The old volume is left
# untouched, which turns an impossible downgrade into switching the claim
# back.
#
# 10Gi rather than 5Gi: MongoDB 8 stores more than 3.6 did for the same data,
# and openebs-hostpath cannot expand a volume after the fact.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omada-data-v6
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
