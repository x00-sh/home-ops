---
# TP-Link Omada SDN controller, migrated from docker-compose on the dev VM.
#
# The data volume was seeded from /opt/omada/data on 2026-08-21 (docker
# stopped first, so the MongoDB copy is consistent) and this was scaled up in
# the same change that committed replicas: 1 — never by `kubectl scale`, which
# the next unrelated reconcile silently reverts (see gitops-and-flux.md).
#
# NOT the upstream mbentley Helm chart. That chart requires an EXTERNAL
# MongoDB (a pre-created omada-db-uri-secret, with the Bitnami mongodb chart
# alongside), which would add a second database engine to a cluster whose
# stated design is one Postgres for Authentik and SQLite everywhere else. The
# image embeds MongoDB, which is how it already runs on docker, so
# app-template plus two volumes reproduces the working deployment exactly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada
spec:
  chartRef:
    kind: OCIRepository
    name: omada
  interval: 1h
  values:
    controllers:
      omada:
        replicas: 1
        # Omada reads /cert only at startup, so a renewed certificate needs a
        # pod restart to reach the keystore. Reloader is already in the
        # cluster; this makes that automatic rather than a diary entry.
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        # The MongoDB data directory is ReadWriteOnce on node-local storage;
        # two pods overlapping would mean two mongod processes over one
        # dbPath.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/mbentley/omada-controller
              # v6 requires MongoDB 8; v5 ran MongoDB 3.6. Upgraded
              # 2026-08-21 by backup/restore onto the fresh omada-data-v6
              # volume, NOT in place — see that PVC's comment.
              #
              # Note upstream deliberately keeps `latest` on the 5.15 line
              # ("the inability for me to perform a migration for v5 to v6
              # without manual user intervention"), so an unpinned tag is
              # doubly wrong here: it would neither upgrade nor stay put
              # predictably. Omada cannot be downgraded.
              #
              # MongoDB 8 requires AVX on amd64 — verified present on this
              # node (avx, avx2) before the jump.
              tag: 6.2.14.11
            env:
              TZ: Europe/Copenhagen
              # Carried over verbatim from docker-compose. The image starts as
              # root and drops to PUID/PGID itself, so there is no
              # runAsNonRoot here — forcing one would break its own
              # privilege drop. This is the exception in this cluster, not the
              # pattern.
              PUID: "1000"
              PGID: "1000"
              MANAGE_HTTP_PORT: "8088"
              MANAGE_HTTPS_PORT: "8043"
              PORTAL_HTTP_PORT: "8088"
              PORTAL_HTTPS_PORT: "8843"
              SHOW_SERVER_LOGS: "true"
              SHOW_MONGODB_LOGS: "false"
            probes:
              # /api/info answers unauthenticated and reports controllerVer,
              # so it is a real readiness signal rather than "the port is
              # open". Plain HTTP on the manage port: the UI redirects to
              # HTTPS but this API path does not.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/info
                    port: 8088
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/info
                    port: 8088
                  periodSeconds: 15
              # A JVM plus MongoDB start is minutes on a cold volume. Without
              # this the liveness probe kills the pod before it ever finishes
              # booting, forever.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/info
                    port: 8088
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 200m
                memory: 1536Mi
              limits:
                # Heavier than anything else in this cluster: a JVM and a
                # MongoDB in one container. Raised from 2Gi for the v6 jump —
                # v5 already sat at ~1500Mi against that limit, and MongoDB 8
                # uses more than 3.6 did. The node has the room (36% actual
                # memory use); it is the sum of *limits* that reads high.
                cpu: "2"
                memory: 4Gi
    service:
      app:
        controller: omada
        # A real LAN address, not a ClusterIP: the switch and the access
        # point inform the controller directly over the LAN and know nothing
        # about cluster networking. Same mechanism as mqtt on 10.0.0.54.
        #
        # 10.0.0.55 continues the static block (.50-.54) and sits below the
        # DHCP pool, which starts at 10.0.0.100.
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.0.55"
          # No external-dns annotation here on purpose: the HTTPRoute below
          # now owns omada.${SECRET_DOMAIN}, pointing it at the internal
          # gateway so the UI is reachable without a port number. The devices
          # are unaffected — DHCP option 138 hands out an IP address
          # (10.0.0.55), never a hostname — which is what lets the human plane
          # and the device plane resolve to different places.
          #
          # The controller's own "Controller Hostname/IP" was set to
          # 10.0.0.55 for the same reason: the hostname no longer answers on
          # the device ports.
        ports:
          # Management UI (HTTPS, self-signed). Reached directly at
          # https://10.0.0.55:8043 for now; putting it behind Authentik needs
          # a BackendTLSPolicy for that self-signed cert, which is a separate
          # change.
          https:
            port: 8043
            protocol: TCP
          http:
            port: 8088
            protocol: TCP
          # Device discovery. UDP, and the reason this cannot be an HTTPRoute.
          discovery:
            port: 29810
            protocol: UDP
          # Adoption, upgrade and the manager/inform channels the devices use.
          manager-v1:
            port: 29811
            protocol: TCP
          adopt-v1:
            port: 29812
            protocol: TCP
          upgrade-v1:
            port: 29813
            protocol: TCP
          manage-v2:
            port: 29814
            protocol: TCP
    route:
      # Single route key, so the chart renders it as `omada` rather than
      # `omada-app`. Adding a second key would rename this one and silently
      # detach anything targeting it by name — see authentik.md's Lessons.
      app:
        hostnames:
          - "omada.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                # 8043, not 8088: see backendtlspolicy.yaml for why the
                # plain-HTTP port cannot be used as a backend.
                port: 8043
    persistence:
      # Read by the entrypoint at startup and imported into Omada's keystore.
      cert:
        type: secret
        name: omada-tls
        globalMounts:
          - path: /cert
            readOnly: true
      data:
        existingClaim: omada-data-v6
        globalMounts:
          - path: /opt/tplink/EAPController/data
      logs:
        existingClaim: omada-logs
        globalMounts:
          - path: /opt/tplink/EAPController/logs
