---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config-backup
spec:
  dependsOn:
    - name: omada
      namespace: network-management
  interval: 1h
  path: ./kubernetes/apps/network-management/config-backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network-management
  wait: true
