---
# The broker credentials, shared by every MQTT client in the house: Home
# Assistant, Zigbee2MQTT and Frigate.
#
# These are the SAME username and password the docker broker uses today,
# deliberately. Home Assistant stores its copy in .storage as a config entry
# with no YAML or env equivalent, so the value cannot be rotated declaratively
# — but it can be *sourced* declaratively, which is what this does. The
# credential now lives in 1Password and reaches the broker without ever being
# written into git, while nothing downstream has to be reconfigured.
#
# 1Password item `mqtt` in the homelab vault, fields `mqtt_user` and
# `mqtt_password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mqtt-secret
    creationPolicy: Owner
    template:
      data:
        MQTT_USERNAME: "{{ .username }}"
        MQTT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: mqtt
        property: mqtt_user
    - secretKey: password
      remoteRef:
        key: mqtt
        property: mqtt_password
