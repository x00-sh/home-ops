---
# replicas: 0 until /opt/homeassistant/config has been copied into
# home-assistant-config. Starting empty runs the onboarding wizard and writes a
# fresh .storage, which the migration would then have to overwrite — and
# .storage is where all 43 config entries and 1211 entities live.
#
# There is deliberately NO route here. homeassistant.x00.sh is live right now,
# served by the docker tunnel. external-dns runs policy=sync, so publishing a
# route for a name that already works would repoint it at an empty cluster.
# The route is added in the cutover commit, not before.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        replicas: 0
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              # The home-operations rebuild, NOT ghcr.io/home-assistant/home-assistant.
              # The official image runs as root and has no non-root mode; this
              # one defaults to nobody:nogroup and keeps Python dependencies in
              # a venv under /config rather than needing a writable site-packages.
              #
              # This is the only workload in the namespace reachable from the
              # internet, so it is the one place where running as root is least
              # defensible. Re-owning the config tree costs nothing here because
              # the migration seeds a brand new volume anyway.
              repository: ghcr.io/home-operations/home-assistant
              # Pinned to what docker runs today; the compose file floats
              # :stable. A Home Assistant config migrates forward, not back.
              tag: 2026.8.1
            env:
              TZ: Europe/Copenhagen
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              # Path is "/", NOT "/healthz" — this version of Home Assistant
              # serves no /healthz route and answers 404, which reads as a
              # failing probe rather than a wrong URL. "/" returns 200 as soon
              # as the frontend is up.
              #
              # The startup probe is the important one. Home Assistant's boot
              # blocks on integrations that reach the network, and a slow or
              # unreachable one (aarlo retries with backoff here) can hold it
              # for minutes. Without this, liveness kills the container before
              # it ever finishes starting, and it restart-loops forever while
              # looking like an application fault.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  # 10 minutes before giving up.
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # Uses ~825 MiB under docker today. 4Gi is headroom for a
                # recorder purge or a database repack, both of which spike.
                memory: 4Gi
    defaultPodOptions:
      # uid 1000 specifically, rather than the image's default nobody: the
      # docker config tree is already owned by 1000, so the seeding copy needs
      # no ownership rewrite beyond .storage/auth, which is the one root-owned
      # file in it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
            # Home Assistant's frontend is almost entirely websockets; without
            # this hint the gateway treats it as plain HTTP/1.1.
            appProtocol: kubernetes.io/ws
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      # Frigate's recordings, read by the media browser. Nested inside /config
      # on purpose — it reproduces the docker bind mount exactly, so every
      # stored path in the config keeps working. Volsync backs up the config
      # PVC only and does not descend into this mount.
      # The Python virtualenv this image builds for custom-integration
      # dependencies. Its own volume so it stays out of the config backup —
      # it is entirely regenerable, and rebuilding it is the correct response
      # to a dependency problem anyway. Same reasoning as jellyfin-cache.
      cache:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      # readOnlyRootFilesystem needs somewhere to write scratch files.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cameras:
        existingClaim: cameras
        globalMounts:
          - path: /config/cameras
