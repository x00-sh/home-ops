---
# The same 1Password item the broker reads, rendered under the env var names
# Zigbee2MQTT recognises. A separate ExternalSecret rather than reusing
# mqtt-secret because the key names ARE the configuration: Zigbee2MQTT maps
# ZIGBEE2MQTT_CONFIG_<SECTION>_<KEY> onto its configuration.yaml, so the names
# have to be exact.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zigbee2mqtt-secret
    creationPolicy: Owner
    template:
      data:
        ZIGBEE2MQTT_CONFIG_MQTT_USER: "{{ .username }}"
        ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: mqtt
        property: mqtt_user
    - secretKey: password
      remoteRef:
        key: mqtt
        property: mqtt_password
