---
# The data directory must already carry the migrated configuration before
# this runs at replicas: 1 — starting against an empty directory would form
# a NEW Zigbee network on the coordinator and orphan every paired device,
# an outcome that cannot be undone without re-pairing each one by hand.
#
# The dongle arrives as an allocated device at /dev/zigbee, courtesy of
# generic-device-plugin. Nothing here names /dev/ttyUSB0, and nothing here has
# to know which host or which USB port it is plugged into.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: zigbee2mqtt
  interval: 1h
  values:
    controllers:
      zigbee2mqtt:
        replicas: 1
        type: deployment
        # Recreate, not RollingUpdate: two Zigbee2MQTT processes must never
        # hold the coordinator at once. Overlapping instances corrupt the
        # network's frame counters.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/koenkk/zigbee2mqtt
              # Pinned to what docker runs today. The compose file floats
              # :latest via watchtower, and this database migrates forward but
              # not backward.
              tag: 2.14.1
            env:
              TZ: Europe/Copenhagen
              # These override the migrated configuration.yaml at runtime, so
              # the file itself moves across untouched. Zigbee2MQTT maps
              # ZIGBEE2MQTT_CONFIG_<SECTION>_<KEY> onto the config tree.
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/zigbee
              # Required. zigbee-herdsman's adapter auto-detection identifies
              # the coordinator type by probing USB metadata (vendor/product
              # info via sysfs), which is not visible here — the pod only has
              # the single bind-mounted device node, not the rest of /dev or
              # /sys that the discovery heuristics expect. Without this, the
              # container fails at startup with "USB adapter discovery error
              # (No valid USB adapter found)" even though the device itself is
              # present, healthy and correctly permissioned. The Sonoff Plus
              # is a CC2652P — Z-Stack 3.x.
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: zstack
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mqtt:1883
            envFrom:
              - secretRef:
                  name: zigbee2mqtt-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                # The device plugin hands the container /dev/zigbee as an
                # allocated resource; asking for it here is what makes the
                # scheduler place this pod only where the dongle exists.
                squat.ai/zigbee: 1
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      # The koenkk image sets no USER and would otherwise run as root, which is
      # what it does under docker today. It does not need to: the device plugin
      # hands over /dev/zigbee as an allocated device, and containerd's
      # device_ownership_from_security_context (talos/all/50-files.yaml) chowns
      # that node to the container's uid. So the one thing root was buying —
      # access to the serial port — is provided without it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: zigbee2mqtt
        ports:
          http:
            port: 8080
    route:
      app:
        # LAN only. The frontend has no auth_token set and is therefore
        # unauthenticated — it joins the *arr admin UIs in the outstanding
        # Authentik forward-auth work rather than being published.
        hostnames:
          - "z2m.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      data:
        existingClaim: zigbee2mqtt-data
        globalMounts:
          - path: /app/data
