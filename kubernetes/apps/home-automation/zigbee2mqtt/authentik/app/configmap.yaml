---
# See kubernetes/apps/media/sonarr/authentik/app/configmap.yaml for the
# pattern this follows. Grants access to the home-automation group, defined
# in kubernetes/apps/home-automation/authentik-blueprint/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-authentik-blueprint
data:
  zigbee2mqtt.yaml: |
    version: 1
    metadata:
      name: zigbee2mqtt-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-zigbee2mqtt
        identifiers:
          name: zigbee2mqtt
        attrs:
          external_host: https://z2m.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: zigbee2mqtt
        attrs:
          name: Zigbee2MQTT
          provider: !KeyOf provider-zigbee2mqtt
          meta_launch_url: https://z2m.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/zigbee2mqtt.svg
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, zigbee2mqtt]]
          group: !Find [authentik_core.group, [name, home-automation]]
        attrs:
          order: 0
          enabled: true
