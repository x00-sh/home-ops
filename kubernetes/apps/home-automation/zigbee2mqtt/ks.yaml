---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
spec:
  dependsOn:
    - name: home-automation-volume
      namespace: home-automation
    - name: mqtt
      namespace: home-automation
    # Without the device plugin there is no squat.ai/zigbee resource, and this
    # pod is unschedulable rather than merely broken.
    - name: generic-device-plugin
      namespace: home-automation
  interval: 1h
  path: ./kubernetes/apps/home-automation/zigbee2mqtt/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-automation
  wait: true
