---
# Holds the restic repositories, one directory per application. On the NAS
# rather than the node, which is the entire point: the node's disk is the thing
# these backups exist to survive.
#
# Separate from media-config-restic rather than shared, because the movers for
# this namespace run as root while the media ones run as uid 1000, and mixing
# two owners inside one repository tree invites permission surprises later.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-automation-config-restic
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 50Gi
