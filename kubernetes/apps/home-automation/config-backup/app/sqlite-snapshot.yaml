---
# A consistent snapshot of Home Assistant's recorder database.
#
# home-assistant_v2.db is ~850 MB with a live write-ahead log and is written
# continuously — every state change in the house lands in it. Volsync's Direct
# copy reads the live file, and copying a database and its -wal at two slightly
# different moments is how you get a backup that will not open. Home Assistant
# has no scheduled-backup feature in a container install (that is Supervisor's
# job), so unlike the *arr apps there is no zip sitting beside it to fall back
# on.
#
# SQLite's online backup API takes a read lock per step and produces a single
# fully-checkpointed file while Home Assistant keeps running — no quiescing, no
# downtime, no cooperation from the application needed.
#
# Zigbee2MQTT's database.db is deliberately not handled here: despite the name
# it is newline-delimited JSON, not SQLite, and at 48 KB a torn copy loses at
# most the last line. Its coordinator_backup.json, the file that actually
# matters, is rewritten whole.
#
# Runs at 00:00 UTC, two hours ahead of the Volsync syncs at 02:00 and 02:10,
# so the snapshot is always finished and settled before it is copied.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlite-snapshot
spec:
  schedule: "0 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # Same uid Home Assistant runs as, so this can read its database
            # and write the snapshot beside it without any elevation.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: snapshot
              # Official image, and its bundled sqlite3 module exposes the
              # online backup API — no package installs at runtime.
              image: docker.io/python:3.13-alpine
              command: ["python3", "-c"]
              args:
                - |
                  import os, sqlite3, sys

                  src = "/config/home-assistant_v2.db"
                  rc = 0

                  if not os.path.exists(src):
                      # Expected before the cutover, when the volume is still
                      # empty. Not a failure worth alerting on.
                      print(f"no database at {src} yet", flush=True)
                      sys.exit(0)

                  dst = src + ".bak"
                  tmp = dst + ".tmp"
                  try:
                      # Write to .tmp and rename, so a snapshot that fails half
                      # way never replaces a good one.
                      if os.path.exists(tmp):
                          os.remove(tmp)
                      source = sqlite3.connect(src)
                      target = sqlite3.connect(tmp)
                      with target:
                          source.backup(target)
                      target.close()
                      source.close()
                      os.replace(tmp, dst)
                      os.chmod(dst, 0o644)
                      print(f"ok {dst} ({os.path.getsize(dst)} bytes)", flush=True)
                  except Exception as err:
                      print(f"FAILED {src}: {err}", flush=True)
                      rc = 1

                  sys.exit(rc)
              volumeMounts:
                - name: config
                  mountPath: /config
              resources:
                requests:
                  cpu: 10m
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: home-assistant-config
