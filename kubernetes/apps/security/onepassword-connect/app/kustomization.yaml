---
# secret.sops.yaml MUST stay listed here. The 2025 attempt omitted it, so the
# adjacent secret was never applied and Connect started with no credentials.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./clustersecretstore.yaml
