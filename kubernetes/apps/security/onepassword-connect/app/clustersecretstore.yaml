---
# The key names here must match secret.sops.yaml exactly. In 2025 the secret
# defined ONEPASSWORD_TOKEN while the store asked for `token`, and every
# ExternalSecret failed with an error that pointed at the store rather than the
# mismatch. The secret's key is `token`; so is this.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local:8080
      vaults:
        homelab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            key: token
            namespace: security
