---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
spec:
  dependsOn:
    - name: onepassword-connect
      namespace: security
    - name: cloudnative-pg
      namespace: database
    # These deploy the three namespace-level ConfigMaps this HelmRelease
    # mounts by name (blueprints.configMaps); without this, a from-scratch
    # apply can start the worker before they exist. The Kustomization objects
    # themselves live in their own namespace (media/home-automation/
    # observability), not `security` — that's just where their
    # targetNamespace points their output.
    #
    # Deliberately NOT listed here: the per-app ...-authentik-blueprint
    # Kustomizations (kubernetes/apps/media/sonarr/authentik/ and siblings).
    # Flux's dependsOn can only be declared on the waiting side, so it can
    # never truly live inside an app's own directory either way — but adding
    # one per app here would mean every app removal also requires an edit in
    # this file. Omitting it just means a from-scratch rebuild has the worker
    # pod retry for a few seconds until that one app's ConfigMap appears,
    # which self-heals well within this Kustomization's own timeout.
    - name: media-authentik-blueprint
      namespace: media
    - name: home-automation-authentik-blueprint
      namespace: home-automation
    - name: observability-authentik-blueprint
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/security/authentik/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  # Longer than the default: the database has to initialise and Authentik runs
  # its migrations before the server reports ready.
  timeout: 15m
  wait: true
