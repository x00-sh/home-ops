---
# Pulls the three values from the `authentik` item in the `homelab` vault and
# renders them under the env var names the chart expects. Field labels in
# 1Password must match the `property` values below exactly.
#
# The Postgres password is deliberately absent: CloudNativePG generates it into
# authentik-postgres-app and the HelmRelease reads it straight from there, so it
# never needs to exist in 1Password at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-secret
    creationPolicy: Owner
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrap_password }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrap_token }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: authentik
        property: secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: authentik
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: authentik
        property: bootstrap_token
