---
# Declarative Authentik configuration. Blueprints are the only part of
# Authentik's config that lives in git rather than only in its database — the
# rest is recoverable from the nightly pg_dump, but this survives a rebuild
# from nothing.
#
# The worker discovers files ending in .yaml under the mounted paths and
# applies them; changes here are picked up without a restart, though the
# ConfigMap update itself takes up to a minute to propagate into the pod.
#
# This is now down to the one piece of forward-auth config that genuinely
# can't live in an app's own directory — see outpost.yaml's own comment.
# Every app's own Provider/Application/(Policy)Binding lives with that app
# instead: kubernetes/apps/media/sonarr/authentik/,
# kubernetes/apps/observability/headlamp/authentik/, and siblings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
data:
  outpost.yaml: |
    version: 1
    metadata:
      name: forward-auth-outpost
    entries:
      # Authentik's embedded outpost only proxies for providers explicitly
      # assigned to it, and that assignment is a single list on the Outpost
      # object rather than something a Provider declares about itself. Every
      # namespace's own authentik-blueprint ConfigMap (kubernetes/apps/media/
      # authentik-blueprint/, .../home-automation/authentik-blueprint/, etc.)
      # defines its own group and per-app providers, but this one list has to
      # live somewhere cross-cutting — this is that one exception, and it has
      # to be touched again each time a new forward-auth app is added
      # anywhere in the cluster. !Find, not !KeyOf: these providers are
      # defined in other ConfigMaps entirely, and !KeyOf only resolves within
      # the blueprint document that set the id.
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, radarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, prowlarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, bazarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, sabnzbd]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, zigbee2mqtt]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, gatus]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, alertmanager]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, qbittorrent]]
