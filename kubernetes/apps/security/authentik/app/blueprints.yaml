---
# Declarative Authentik configuration. Blueprints are the only part of
# Authentik's config that lives in git rather than only in its database — the
# rest is recoverable from the nightly pg_dump, but this survives a rebuild
# from nothing.
#
# The worker discovers files ending in .yaml under the mounted paths and
# applies them; changes here are picked up without a restart, though the
# ConfigMap update itself takes up to a minute to propagate into the pod.
#
# The client secret is NOT in here: it arrives as an env var from the
# authentik-secret ExternalSecret, and is read with !Env at apply time. Both
# sides of the OIDC handshake read the same 1Password item.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
data:
  groups.yaml: |
    version: 1
    metadata:
      name: forward-auth-groups
    entries:
      # Namespace-scoped access groups for Envoy forward-auth (SecurityPolicy
      # ext_authz), mirroring the group: labels Gatus already uses
      # (media/home/observability). One group per namespace that has apps
      # behind forward auth, not one group per app — membership in `media`
      # covers every *arr admin UI at once.
      - model: authentik_core.group
        id: group-media
        identifiers:
          name: media
        attrs:
          is_superuser: false
      - model: authentik_core.group
        id: group-home-automation
        identifiers:
          name: home-automation
        attrs:
          is_superuser: false
      # Not attached to any Application yet — created now because it costs
      # nothing and this is the mechanism the README's open item on exposing
      # status.x00.sh/dash.x00.sh will reuse. Grafana and Headlamp keep their
      # own OIDC login for now; folding them into forward-auth is separate
      # work.
      - model: authentik_core.group
        id: group-observability
        identifiers:
          name: observability
        attrs:
          is_superuser: false

      - model: authentik_core.group
        identifiers:
          name: media
        attrs:
          users:
            - !Find [authentik_core.user, [username, jlor]]
      - model: authentik_core.group
        identifiers:
          name: home-automation
        attrs:
          users:
            - !Find [authentik_core.user, [username, jlor]]
  outpost.yaml: |
    version: 1
    metadata:
      name: forward-auth-outpost
    entries:
      # Authentik's embedded outpost only proxies for providers explicitly
      # assigned to it, and that assignment is a single list on the Outpost
      # object rather than something a Provider declares about itself — so
      # unlike every other file in this ConfigMap, this one has to be touched
      # again each time a new forward-auth app is added, adding its provider
      # to this same list. !Find, not !KeyOf: these providers are defined in
      # sibling blueprint files, and !KeyOf only resolves within the blueprint
      # document that set the id.
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
  sonarr.yaml: |
    version: 1
    metadata:
      name: sonarr-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-sonarr
        identifiers:
          name: sonarr
        attrs:
          external_host: https://sonarr.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          provider: !KeyOf provider-sonarr
          meta_launch_url: https://sonarr.${SECRET_DOMAIN}
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, sonarr]]
          group: !Find [authentik_core.group, [name, media]]
        attrs:
          order: 0
          enabled: true
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
    entries:
      # Membership in this group is what makes someone a Grafana admin; the
      # role mapping in Grafana's config keys off the group name.
      - model: authentik_core.group
        id: group-grafana-admins
        identifiers:
          name: grafana-admins
        attrs:
          is_superuser: false

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-grafana
        identifiers:
          name: grafana
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          # Must be stated explicitly. The UI pre-fills these, but a blueprint
          # that omits the field leaves it empty, and Authentik then rejects
          # every authorize request with "invalid_request" before it even looks
          # at the user.
          grant_types:
            - authorization_code
            - refresh_token
          # Implicit consent: no "do you allow this app" screen for a service
          # that is only ever used by its own owner.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.${SECRET_DOMAIN}/login/generic_oauth
          # `profile` is what carries the groups claim, so it is required for
          # the admin role mapping to work — not merely cosmetic.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider-grafana
          meta_launch_url: https://grafana.${SECRET_DOMAIN}
          policy_engine_mode: any
  headlamp.yaml: |
    version: 1
    metadata:
      name: headlamp-oidc
    entries:
      # Unlike Grafana, this group is not merely a role mapping: the Kubernetes
      # API server is configured to trust this issuer, and a ClusterRoleBinding
      # grants `view` to `oidc:headlamp-users`. Membership here is what decides
      # whether someone can read the cluster at all.
      - model: authentik_core.group
        id: group-headlamp-users
        identifiers:
          name: headlamp-users
        attrs:
          is_superuser: false

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-headlamp
        identifiers:
          name: headlamp
        attrs:
          client_type: confidential
          client_id: headlamp
          client_secret: !Env HEADLAMP_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://dash.${SECRET_DOMAIN}/oidc-callback
          # `profile` carries the groups claim the API server reads to decide
          # authorisation; `email` carries the username claim it reads to decide
          # identity. Neither is optional here.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          provider: !KeyOf provider-headlamp
          meta_launch_url: https://dash.${SECRET_DOMAIN}
          policy_engine_mode: any
