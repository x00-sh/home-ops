---
# Authentik 2026.x no longer needs Redis — the chart has no redis dependency and
# no redis values, because task queuing and caching moved onto Postgres. The
# migration plan still lists Redis; it is not required.
#
# Non-secret config stays in these values and becomes AUTHENTIK_* env vars via a
# chart-generated Secret. Secrets arrive separately through global.envFrom,
# which is concatenated after that Secret and therefore wins on any key clash.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  # The HelmRelease has its own timeout, separate from the Kustomization's.
  # Authentik runs database migrations before the server reports ready; first
  # boot took about six minutes, so the 5m default fails the install even though
  # the deployment goes on to come up fine. Upgrades with migrations do the same.
  timeout: 15m
  values:
    blueprints:
      configMaps:
        - authentik-blueprints
        # Forward-auth config for apps outside this namespace, defined
        # alongside them instead of centralized here. Each namespace's own
        # <namespace>-authentik-blueprint ConfigMap holds just that
        # namespace's access group (kubernetes/apps/media/authentik-blueprint/
        # is the pattern); each individual app's own Provider/Application/
        # PolicyBinding lives with the app itself instead
        # (kubernetes/apps/media/sonarr/authentik/ is that pattern) so
        # removing an app's directory removes its forward-auth config too.
        # Add an entry here for every ConfigMap either kind produces.
        - media-authentik-blueprint
        - home-automation-authentik-blueprint
        - observability-authentik-blueprint
        - sonarr-authentik-blueprint
        - radarr-authentik-blueprint
        - prowlarr-authentik-blueprint
        - bazarr-authentik-blueprint
        - sabnzbd-authentik-blueprint
        - zigbee2mqtt-authentik-blueprint
        - grafana-authentik-blueprint
        - headlamp-authentik-blueprint
        - gatus-authentik-blueprint
    authentik:
      # Points at the CloudNativePG read-write service
      postgresql:
        host: authentik-postgres-rw
        name: authentik
        user: authentik
        port: 5432
      bootstrap_email: jakob.rosenlund@gmail.com
      error_reporting:
        enabled: false
    global:
      env:
        # CloudNativePG owns and rotates this; read it where it lives rather
        # than copying it into 1Password
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: password
      envFrom:
        - secretRef:
            name: authentik-secret
        - secretRef:
            name: authentik-oidc-clients
    server:
      # HTTPRoute is written by hand in httproute.yaml. The chart's own route
      # support is documented as an early beta that may change.
      route:
        main:
          enabled: false
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
