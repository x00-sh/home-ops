---
# NOTE: this deliberately does NOT alert on "CrowdSec detected something" —
# that would need cs_alerts/cs_active_decisions, which do not exist on this
# chart's actual /metrics output (v1.7.8, confirmed by scraping the live
# endpoint: only cs_bucket_*, cs_parser_hits_*, cs_node_hits_*, cs_lapi_*
# are exposed — verified via `kubectl -n security exec crowdsec-agent-<pod>
# -- curl localhost:6060/metrics`; an earlier draft of this rule referenced
# metric names from CrowdSec docs that don't apply to this version and would
# have silently never fired). Getting real detections into an alert needs
# CrowdSec's own notification-http plugin instead — deliberately not wired
# up yet, since it needs either a new secret this cluster's rules say must
# be hand-edited (never written by an assistant) or a hand-built
# Alertmanager-schema payload template, both real design decisions.
#
# What this rule covers instead: the pipeline being silently dead — the
# same "silence looks like success" failure mode Configarr's rule guards
# against. cs_parser_hits_total is a real counter (verified live) that only
# grows while log lines are actually being read and handed to parsers; if
# it stops moving, Envoy stopped writing logs, the acquisition glob stopped
# matching, or the agent died in a way that still passes its liveness probe.
#
# `source` is crowdsec's own label for the exact container-log file it is
# tailing, so it embeds the pod name — it's cardinality that only grows,
# never shrinks, since crowdsec keeps exposing a metric series for a file
# it once tailed even after that pod is gone (confirmed live 2026-08-31:
# an unmatched per-source increase()==0 fired 6 stale alerts at once,
# referencing two prior envoy ReplicaSets' pod names plus the
# `shutdown-manager` lifecycle-hook container, which legitimately logs
# almost nothing and isn't part of the traffic path). Matching only
# `*_envoy-*.log` drops that sidecar; aggregating with a bare max() drops
# the pod/source labels entirely, so the alert only fires when every
# source — old dead ones and the live pod alike — is flat, i.e. traffic
# genuinely stopped, and a future envoy rollout can't spawn a new
# permanently-stuck alert instance the way per-source matching did.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec
spec:
  groups:
    - name: crowdsec
      rules:
        - alert: CrowdSecNotProcessingLogs
          expr: >-
            max(increase(cs_parser_hits_total{namespace="security", source=~".*_envoy-.*\\.log"}[30m])) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: CrowdSec has stopped processing Envoy access logs
            description: >-
              No log lines have reached CrowdSec's parser in 30 minutes.
              Envoy normally produces continuous traffic (Gatus alone
              checks it every minute), so this means the pipeline is stuck,
              not that traffic genuinely stopped.

        # crowdsec-ca's duration is patched to 43800h (~5 years) via the
        # HelmRelease's postRenderers — see helmrelease.yaml's comment for
        # why the chart itself gives no other way to set this. This alert is
        # the backstop regardless: a 60-day warning gives real lead time
        # before cert-manager's own auto-renewal (30 days before expiry,
        # renewBefore: 720h), because renewal is exactly the moment
        # OPNsense's static exported copy of crowdsec-lapi-tls's ca.crt goes
        # stale and its bouncer's TLS trust breaks silently until someone
        # re-exports it by hand.
        - alert: CrowdSecRootCAExpiringSoon
          expr: >-
            certmanager_certificate_expiration_timestamp_seconds{namespace="security", name="crowdsec-ca"} - time() < 86400 * 60
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: CrowdSec's root CA renews within 60 days
            description: >-
              cert-manager will auto-renew crowdsec-ca soon (it renews 30
              days before expiry). When it does, OPNsense's exported copy of
              crowdsec-lapi-tls's ca.crt goes stale and the firewall
              bouncer's TLS trust to LAPI breaks silently — re-export the CA
              cert to OPNsense once the rotation actually happens, not just
              on this warning.
