---
# HTTP-level anomaly/scan detection, reading Envoy Gateway's own JSON access
# logs (both envoy-internal and envoy-external, network namespace) rather
# than a separate log pipeline. Falco (./../falco/) covers syscall-level
# detection inside containers; this covers request-pattern detection at the
# gateway — path traversal probing, SQLi/XSS probing, wordpress/CVE
# scanning, bad user agents, generic brute force.
#
# Deliberately DETECTION-ONLY. CrowdSec's Envoy remediation component (the
# bouncer that would actually block a flagged IP at the gateway via an
# ext_authz SecurityPolicy, same mechanism as Authentik's forward auth) is a
# young, single-maintainer, explicitly "not tested in production" project as
# of 2026-08. That's an acceptable risk for read-only detection feeding an
# alert, not for something sitting in the live traffic path of every public
# app. Revisit attaching it once this has run for a while with a real signal
# to judge false-positive rate against — same reasoning as CPUThrottlingHigh
# being tuned by observation rather than guessed up front.
#
# No CAPI enrollment (no ENROLL_KEY): this cluster's local scenarios don't
# need CrowdSec's central API or the community blocklist, and enrolling
# would mean depending on an external account for a homelab.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chart:
    spec:
      chart: crowdsec
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: crowdsecurity
  interval: 1h
  values:
    # Real "CrowdSec detected something" alerts. No Prometheus metric
    # reflects a new alert/decision in this chart version (confirmed by
    # scraping /metrics live — see prometheusrule.yaml's comment), so this
    # uses CrowdSec's own notification-http plugin instead, posting straight
    # to Alertmanager's v2 API — the same pattern falcosidekick uses for
    # Falco, reusing the existing Alertmanager -> ntfy path rather than a new
    # secret or a new notification mechanism. Verified with `cscli
    # notifications test http_default` against the running LAPI before
    # trusting the template — its synthetic test alert has a real non-nil
    # Source (scope "Ip", value "10.10.10.10") and CreatedAt already in
    # RFC3339, both confirmed from CrowdSec's own cscli source
    # (cmd/crowdsec-cli/clinotifications/notifications.go), so the template
    # below is exercised the same way a real alert would be.
    config:
      notifications:
        http.yaml: |
          type: http
          name: http_default
          log_level: info
          group_wait: 30s
          group_threshold: 5
          url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/api/v2/alerts
          method: POST
          headers:
            Content-Type: application/json
          # toJson (a CrowdSec template helper, not stdlib) handles string
          # escaping safely — hand-interpolating scenario names/IPs into raw
          # JSON without it risks a malformed body on any value containing a
          # quote. GetScenario/GetScope/GetValue are models.Alert's own
          # nil-safe accessors (pkg/models/helpers.go), not raw field access.
          format: |
            [
            {{range $i, $a := .}}{{if $i}},{{end}}{
              "labels": {
                "alertname": {{$a.GetScenario | toJson}},
                "severity": "warning",
                "source": "crowdsec"
              },
              "annotations": {
                "summary": {{printf "CrowdSec: %s matched %s %s" $a.GetScenario $a.GetScope $a.GetValue | toJson}}
              },
              "startsAt": {{$a.CreatedAt | toJson}}
            }{{end}}
            ]
      # Matches the chart's own commented-out default example almost
      # verbatim (config/profiles.yaml upstream) — every scenario here is
      # IP-scoped (the envoy-logs parser sets source_ip from
      # x-forwarded-for), so Alert.GetScope() == "Ip" covers all of them.
      # decisions: is inert without a bouncer attached (nothing polls LAPI
      # to enforce it) — kept anyway so this doesn't need touching if a
      # bouncer is ever added later.
      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - http_default
        on_success: break
    # Controls how the agent's k8s log source strips the container runtime's
    # own log-line wrapper before handing lines to parsers — the chart
    # defaults this to "docker", which is wrong here (containerd, confirmed
    # via `kubectl get nodes -o wide`) and would silently corrupt every line
    # rather than error. Log reading itself is a hostPath mount of the
    # node's /var/log (agent.hostVarLog, chart default true) — the same
    # mechanism Alloy already uses, not a Kubernetes API log stream, so no
    # extra RBAC is needed to read Envoy's logs from the network namespace.
    container_runtime: containerd
    agent:
      acquisition:
        # The chart turns this into a plain filesystem glob, NOT a regex —
        # `filenames: /var/log/containers/{{ podName }}_{{ namespace }}_*.log`
        # (see charts/crowdsec/templates/acquis-configmap.yaml) — so this
        # needs shell-style `*`, not `.*`. A regex-style pattern here would
        # match nothing and fail silently (no error, just an empty read).
        #
        # `program` is a label stamped on every matched line, not a filter:
        # the trailing `*.log` also matches the pod's other container
        # (shutdown-manager), which will be mislabeled `program: envoy` too.
        # Harmless in practice — shutdown-manager logs nothing under normal
        # operation — but the chart's acquisition model has no way to filter
        # by container name, only by pod-name glob.
        - namespace: network
          podName: envoy-external-*
          program: envoy
          poll_without_inotify: true
        - namespace: network
          podName: envoy-internal-*
          program: envoy
          poll_without_inotify: true
      env:
        # yanis-kouidri/envoy-logs is a community parser (not yet merged
        # into crowdsecurity/hub, tracked via a fork branch the hub index
        # still resolves) built specifically for Envoy Gateway's default
        # JSON access log format — verified field-for-field against a real
        # captured log line from this cluster before committing to it. It
        # pulls in crowdsecurity/base-http-scenarios, so the actual
        # detection rules (http-probing, http-sqli-probing,
        # http-path-traversal-probing, http-cve-probing, etc.) are the
        # mainstream official ones, not community-authored.
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      metrics:
        enabled: true
        podMonitor:
          enabled: true
    lapi:
      persistentVolume:
        data:
          storageClassName: openebs-hostpath
        config:
          storageClassName: openebs-hostpath
      metrics:
        enabled: true
        podMonitor:
          enabled: true
      # Confirmed upstream bug, still open: crowdsecurity/helm-charts#331.
      # LAPI ships 4 default postoverflows baked into the image config
      # (cdn-whitelist, google-special-crawlers-whitelist,
      # seo-bots-whitelist, rdns) whose *data* files (Cloudflare ranges,
      # Google/SEO crawler IPs, GeoLite2 DBs) are never fetched — LAPI's
      # docker_start.sh has all agent-side collection/hub-install logic
      # stripped out (see its own header comment), so nothing ever
      # populates them, even though /var/lib/crowdsec/data (the
      # `persistentVolume.data` PVC above) genuinely does persist across
      # restarts here — confirmed by checking `mount` and the PVC list, so
      # this isn't the "no PV at all" variant of the bug some other reports
      # describe. The community-verified one-shot fix is `cscli hub
      # upgrade` (confirmed live in this cluster: it fetched all 9 missing
      # files, including both GeoLite2 DBs — no MaxMind account needed,
      # CrowdSec mirrors them). `cscli` itself can't run before the main
      # container's own entrypoint has generated /etc/crowdsec/config.yaml
      # (credentials, DB connection etc.), which an initContainer starting
      # from the same image doesn't have yet — so this fetches the same
      # files directly instead, bypassing cscli/config entirely. `wget -nc`
      # is a real no-op (verified: mtime unchanged) once files exist on the
      # persistent volume, so this is a fast skip on every normal restart,
      # not a repeated download — it only does real work again after a
      # from-scratch PVC (e.g. disaster recovery).
      extraInitContainers:
        - name: fetch-hub-data
          image: crowdsecurity/crowdsec:v1.7.8
          command:
            - sh
            - -c
            - |
              set -e
              cd /var/lib/crowdsec/data
              for url in \
                https://hub-data.crowdsec.net/whitelists/cdn_providers/cloudflare_ips.txt \
                https://hub-data.crowdsec.net/whitelists/cdn_providers/cloudflare_ip6s.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/google_special_crawlers_ipv4.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/google_special_crawlers_ipv6.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/rdns_seo_bots.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/ip_seo_bots.txt \
                https://hub-data.crowdsec.net/mmdb_update/GeoLite2-City.mmdb \
                https://hub-data.crowdsec.net/mmdb_update/GeoLite2-ASN.mmdb \
              ; do
                wget -q -nc -O "$(basename "$url")" "$url" || echo "warn: failed to fetch $url"
              done
              # Source filename really is misspelled upstream ("rnds"); the
              # postoverflow YAML's dest_file is the correctly-spelled
              # rdns_seo_bots.regex, so basename() alone would land here
              # under the wrong name.
              wget -q -nc -O rdns_seo_bots.regex \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/rnds_seo_bots.regex \
                || echo "warn: failed to fetch rdns_seo_bots.regex"
          volumeMounts:
            - name: crowdsec-db
              mountPath: /var/lib/crowdsec/data
              subPath: crowdsec
