---
# HTTP-level anomaly/scan detection, reading Envoy Gateway's own JSON access
# logs (both envoy-internal and envoy-external, network namespace) rather
# than a separate log pipeline. Falco (./../falco/) covers syscall-level
# detection inside containers; this covers request-pattern detection at the
# gateway — path traversal probing, SQLi/XSS probing, wordpress/CVE
# scanning, bad user agents, generic brute force.
#
# Deliberately DETECTION-ONLY. CrowdSec's Envoy remediation component (the
# bouncer that would actually block a flagged IP at the gateway via an
# ext_authz SecurityPolicy, same mechanism as Authentik's forward auth) is a
# young, single-maintainer project, explicitly documented as not tested in
# production. That's an acceptable risk for read-only detection feeding an
# alert, not for something sitting in the live traffic path of every public
# app.
#
# No CAPI *enrollment* (no ENROLL_KEY, no link to a CrowdSec Console
# account) — that's a separate thing from the free community blocklist
# pull, which LAPI does by default and this cluster keeps: DISABLE_ONLINE_API
# is intentionally unset on lapi.env, unlike agent.env where it's "true" —
# the agent has no business reaching CAPI itself, but LAPI pulling the
# shared blocklist is wanted. Do NOT add DISABLE_ONLINE_API to lapi.env: it
# would silently drop every CAPI-origin decision the OPNsense firewall
# bouncer is enforcing. See areas/security.md's Decisions and Incidents.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chart:
    spec:
      chart: crowdsec
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: crowdsecurity
  interval: 1h
  # The chart's own root-CA Certificate template (templates/tls/ca-certificate.yaml)
  # hardcodes no duration/renewBefore and exposes no values field for either,
  # at this pinned chart version. Left alone, crowdsec-ca inherits
  # cert-manager's own default (~90 days, renews ~30 days before expiry),
  # and OPNsense's ca_cert_path is a static exported copy of
  # crowdsec-lapi-tls's ca.crt that goes stale silently the moment that
  # rotation happens — see docs/open-items.md and the PrometheusRule below.
  # A long-lived root is standard PKI practice regardless (only the leaf certs
  # — agent/bouncer/lapi, already on their own 2160h/720h cycle — need to
  # rotate often); this just makes that rotation rare instead of quarterly.
  # postRenderers is the correct Flux mechanism for patching Helm-rendered
  # output a chart gives no values hook for.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Certificate
              name: crowdsec-ca
            patch: |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: crowdsec-ca
              spec:
                duration: 43800h
                renewBefore: 720h
  values:
    # mTLS between agent and LAPI instead of the chart's default
    # username/token self-registration. The default flow has the agent's
    # init container call `cscli lapi register --machine "$USERNAME"` on
    # every pod start, using the pod's own (stable) name as the machine
    # identity — but its credentials live in an emptyDir, wiped on every
    # sandbox recreation (node reboot, eviction, etc.). LAPI's machine
    # record persists across that, so every restart re-registers the same
    # name against a record that's still there, and the agent crash-loops
    # on a 403 "user already exist" until someone runs `cscli machines
    # delete` by hand.
    #
    # With tls.enabled, the chart switches the agent's init container to a
    # plain `wait-for-lapi` (no cscli register call at all — see
    # charts/crowdsec/templates/agent-daemonSet.yaml, gated on
    # `tls.agent.tlsClientAuth`, itself default-true) and LAPI authorizes
    # the agent by its client certificate instead of a per-pod machine
    # record. The cert is a cert-manager Secret shared across every
    # instance of the DaemonSet pod, not something regenerated per restart,
    # so there's no identity to collide with. tls.certManager.issuerRef is
    # deliberately left unset: the chart then provisions its own
    # self-signed root ClusterIssuer and CA scoped to this release, with no
    # dependency on any ClusterIssuer already in this cluster.
    tls:
      enabled: true
      certManager:
        # Chart bug: templates/tls/{agent,bouncer}-certificate.yaml always
        # emit a `secretTemplate:` key, only its children (annotations/
        # labels) are conditional — with both left empty that key renders
        # as a literal YAML null, which cert-manager's CRD (a structural
        # schema requiring `object`, not nullable) rejects outright. Any
        # non-empty child avoids the empty block; this label is otherwise
        # inert.
        secretTemplate:
          labels:
            app.kubernetes.io/managed-by: crowdsec-helm
    # Real "CrowdSec detected something" alerts. No Prometheus metric
    # reflects a new alert/decision in this chart version — see
    # prometheusrule.yaml's comment — so this uses CrowdSec's own
    # notification-http plugin instead, posting straight to Alertmanager's
    # v2 API — the same pattern falcosidekick uses for Falco, reusing the
    # existing Alertmanager -> ntfy path rather than a new secret or a new
    # notification mechanism. `cscli notifications test http_default`
    # against the running LAPI is how to sanity-check the template: its
    # synthetic test alert has a real non-nil Source (scope "Ip", value
    # "10.10.10.10") and CreatedAt already in RFC3339 — both come from
    # CrowdSec's own cscli source (cmd/crowdsec-cli/clinotifications/
    # notifications.go), so the template below is exercised the same way a
    # real alert would be.
    config:
      notifications:
        http.yaml: |
          type: http
          name: http_default
          log_level: info
          group_wait: 30s
          group_threshold: 5
          url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/api/v2/alerts
          method: POST
          headers:
            Content-Type: application/json
          # toJson (a CrowdSec template helper, not stdlib) handles string
          # escaping safely — hand-interpolating scenario names/IPs into raw
          # JSON without it risks a malformed body on any value containing a
          # quote. GetScenario/GetScope/GetValue are models.Alert's own
          # nil-safe accessors (pkg/models/helpers.go), not raw field access.
          # `description` adds the GCP-style source context (country/ASN)
          # that was missing from the plain ntfy notification — $a.Source.Cn/
          # AsNumber/AsName are read directly (no Get* accessor exists for
          # them) because they're plain, non-pointer strings on models.Source
          # (pkg/models/source.go) and Source itself is a required,
          # schema-validated field on Alert, so it's never nil by the time a
          # notification fires (per the pinned crowdsec v1.7.8 source,
          # matching this HelmRelease's own LAPI image tag).
          format: |
            [
            {{range $i, $a := .}}{{if $i}},{{end}}{
              "labels": {
                "alertname": {{$a.GetScenario | toJson}},
                "severity": "warning",
                "source": "crowdsec"
              },
              "annotations": {
                "summary": {{printf "CrowdSec: %s matched %s %s" $a.GetScenario $a.GetScope $a.GetValue | toJson}},
                "description": {{printf "Source %s — %s, AS%s %s." $a.GetValue $a.Source.Cn $a.Source.AsNumber $a.Source.AsName | toJson}}
              },
              "startsAt": {{$a.CreatedAt | toJson}}
            }{{end}}
            ]
      # Matches the chart's own commented-out default example almost
      # verbatim (config/profiles.yaml upstream) — every scenario here is
      # IP-scoped (the envoy-logs parser sets source_ip from
      # x-forwarded-for), so Alert.GetScope() == "Ip" covers all of them.
      # decisions: is inert without a bouncer attached (nothing polls LAPI
      # to enforce it) — kept anyway so this doesn't need touching if a
      # bouncer is ever added later.
      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - http_default
        on_success: break
    # Controls how the agent's k8s log source strips the container runtime's
    # own log-line wrapper before handing lines to parsers — the chart
    # defaults this to "docker", which is wrong for a containerd node and
    # would silently corrupt every line rather than error. Log reading
    # itself is a hostPath mount of the
    # node's /var/log (agent.hostVarLog, chart default true) — the same
    # mechanism Alloy already uses, not a Kubernetes API log stream, so no
    # extra RBAC is needed to read Envoy's logs from the network namespace.
    container_runtime: containerd
    agent:
      acquisition:
        # The chart turns this into a plain filesystem glob, NOT a regex —
        # `filenames: /var/log/containers/{{ podName }}_{{ namespace }}_*.log`
        # (see charts/crowdsec/templates/acquis-configmap.yaml) — so this
        # needs shell-style `*`, not `.*`. A regex-style pattern here would
        # match nothing and fail silently (no error, just an empty read).
        #
        # `program` is a label stamped on every matched line, not a filter:
        # the trailing `*.log` also matches the pod's other container
        # (shutdown-manager), which will be mislabeled `program: envoy` too.
        # Harmless in practice — shutdown-manager logs nothing under normal
        # operation — but the chart's acquisition model has no way to filter
        # by container name, only by pod-name glob.
        - namespace: network
          podName: envoy-external-*
          program: envoy
          poll_without_inotify: true
        - namespace: network
          podName: envoy-internal-*
          program: envoy
          poll_without_inotify: true
      env:
        # yanis-kouidri/envoy-logs is a community parser (not yet merged
        # into crowdsecurity/hub, tracked via a fork branch the hub index
        # still resolves) built specifically for Envoy Gateway's default
        # JSON access log format. It pulls in
        # crowdsecurity/base-http-scenarios, so the actual
        # detection rules (http-probing, http-sqli-probing,
        # http-path-traversal-probing, http-cve-probing, etc.) are the
        # mainstream official ones, not community-authored.
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      metrics:
        enabled: true
        podMonitor:
          enabled: true
    lapi:
      # Second chart gap: templates/tls/{agent,bouncer}-certificate.yaml
      # issue client certs with organizationalUnits agent-ou/bouncer-ou, but
      # nothing in the chart ever sets AGENTS_ALLOWED_OU/BOUNCERS_ALLOWED_OU
      # (zero references anywhere in the chart source). LAPI's server-side
      # OU allowlist defaults to empty, so every client cert is rejected
      # outright: "client certificate OU [agent-ou] doesn't match expected OU
      # []" — the agent's own login attempt to LAPI fails until this is set.
      # docker_start.sh applies these unconditionally on every boot (not
      # gated behind the chart's own "first run" checks), so setting them
      # here is enough — no PVC reset needed.
      env:
        - name: AGENTS_ALLOWED_OU
          value: agent-ou
        - name: BOUNCERS_ALLOWED_OU
          value: bouncer-ou
      persistentVolume:
        data:
          storageClassName: openebs-hostpath
        config:
          storageClassName: openebs-hostpath
      # OPNsense's firewall bouncer runs on the box itself, outside the
      # cluster's pod network, so it needs a real LAN address the same way
      # Mosquitto does for Frigate (see home-automation/mqtt) — in-cluster
      # clients still resolve crowdsec-service via ClusterIP and never see
      # this IP.
      service:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.0.56"
      metrics:
        enabled: true
        podMonitor:
          enabled: true
      # Upstream bug, still open: crowdsecurity/helm-charts#331. LAPI ships
      # 4 default postoverflows baked into the image config
      # (cdn-whitelist, google-special-crawlers-whitelist,
      # seo-bots-whitelist, rdns) whose *data* files (Cloudflare ranges,
      # Google/SEO crawler IPs, GeoLite2 DBs) are never fetched — LAPI's
      # docker_start.sh has all agent-side collection/hub-install logic
      # stripped out (see its own header comment), so nothing ever
      # populates them, even though /var/lib/crowdsec/data (the
      # `persistentVolume.data` PVC above) genuinely does persist across
      # restarts. The community-verified one-shot fix is `cscli hub
      # upgrade`, which fetches the missing files (including both GeoLite2
      # DBs — no MaxMind account needed, CrowdSec mirrors them). `cscli`
      # itself can't run before the main container's own entrypoint has
      # generated /etc/crowdsec/config.yaml (credentials, DB connection
      # etc.), which an initContainer starting from the same image doesn't
      # have yet — so this fetches the same files directly instead,
      # bypassing cscli/config entirely. `wget -nc` is a no-op once files
      # exist on the persistent volume, so this is a fast skip on every
      # normal restart, not a repeated download — it only does real work
      # again after a from-scratch PVC (e.g. disaster recovery).
      extraInitContainers:
        - name: fetch-hub-data
          image: crowdsecurity/crowdsec:v1.7.8
          command:
            - sh
            - -c
            - |
              set -e
              cd /var/lib/crowdsec/data
              for url in \
                https://hub-data.crowdsec.net/whitelists/cdn_providers/cloudflare_ips.txt \
                https://hub-data.crowdsec.net/whitelists/cdn_providers/cloudflare_ip6s.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/google_special_crawlers_ipv4.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/google_special_crawlers_ipv6.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/rdns_seo_bots.txt \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/ip_seo_bots.txt \
                https://hub-data.crowdsec.net/mmdb_update/GeoLite2-City.mmdb \
                https://hub-data.crowdsec.net/mmdb_update/GeoLite2-ASN.mmdb \
              ; do
                wget -q -nc -O "$(basename "$url")" "$url" || echo "warn: failed to fetch $url"
              done
              # Source filename really is misspelled upstream ("rnds"); the
              # postoverflow YAML's dest_file is the correctly-spelled
              # rdns_seo_bots.regex, so basename() alone would land here
              # under the wrong name.
              wget -q -nc -O rdns_seo_bots.regex \
                https://hub-data.crowdsec.net/whitelists/benign_bots/search_engine_crawlers/rnds_seo_bots.regex \
                || echo "warn: failed to fetch rdns_seo_bots.regex"
          volumeMounts:
            - name: crowdsec-db
              mountPath: /var/lib/crowdsec/data
              subPath: crowdsec
