---
# Fourth app in the CNPG consolidation initiative, after Seerr/Bazarr
# (2026-08-28), Prowlarr (2026-08-29) and Radarr (2026-08-29) — see
# areas/media.md. Same two-database (main+log) shape, using CNPG's
# declarative Database CRD for the second one. Sonarr goes last since its
# SQLite file (100MB) is by far the largest of the four apps migrated so
# far; the truncate-before-load procedure was validated on Radarr's
# smaller 10MB file first.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarr-postgres
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: sonarr-main
      owner: sonarr
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-log
spec:
  name: sonarr-log
  owner: sonarr
  cluster:
    name: sonarr-postgres
