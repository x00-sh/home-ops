---
# Same two-database (main+log) shape as Prowlarr/Radarr, using CNPG's
# declarative Database CRD for the second one. Sonarr's SQLite file
# (100MB) is far larger than Radarr's (10MB), so the truncate-before-load
# procedure is validated on the smaller file first — see radarr/app/postgres.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarr-postgres
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: sonarr-main
      owner: sonarr
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-log
spec:
  name: sonarr-log
  owner: sonarr
  cluster:
    name: sonarr-postgres
