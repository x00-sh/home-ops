---
# replicas: 1 until the existing configuration has been copied into
# sonarr-config. Starting empty would create a fresh database that the
# migration would then have to overwrite.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: sonarr
  interval: 1h
  values:
    controllers:
      sonarr:
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hotio/sonarr
              tag: release-4.0.19.2979
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
    route:
      app:
        # Internal gateway: these were LAN-only under docker, and Authentik
        # forward auth is layered on top rather than instead of that.
        hostnames:
          - "sonarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8989
      # A SECOND HTTPRoute on the same hostname, carrying no SecurityPolicy,
      # so /api and /ping reach the app without Authentik in the way.
      #
      # This exists because Envoy Gateway's extAuth REPLACES the request path
      # when it calls the outpost (it sends /outpost.goauthentik.io/auth/envoy
      # and no X-Forwarded-Uri), so Authentik never learns the original path
      # and its own `skip_path_regex` field cannot work here — it is only
      # usable with Traefik/nginx-style forward auth, which pass the URI.
      # Splitting the route is what actually works, and it is plain Gateway
      # API rather than an EnvoyPatchPolicy.
      #
      # Gateway API resolves the overlap by match specificity, not by order:
      # the longer PathPrefix wins, so /api goes here and everything else
      # falls through to the gated route above. The API is NOT unprotected —
      # sonarr enforces its own X-Api-Key on every request, and this hostname
      # is LAN/WireGuard-only on envoy-internal. This restores exactly the
      # pre-Authentik posture for /api while the UI stays fully gated.
      api:
        hostnames:
          - "sonarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /ping
            backendRefs:
              - identifier: app
                port: 8989
    persistence:
      config:
        existingClaim: sonarr-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
