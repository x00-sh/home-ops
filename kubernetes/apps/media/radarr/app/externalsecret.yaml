---
# Pins Radarr's own API key so a config PVC rebuilt from scratch boots with
# the SAME key already recorded in Prowlarr's Applications, Configarr's
# secrets.yml (configarr/app/secret.sops.yaml) and the host's arr MCP config
# — instead of generating a fresh random one that silently breaks all three.
#
# 1Password item `radarr` in the homelab vault, field `api_key`. Must be set
# to the value already live in Radarr's own Settings > General > Security,
# not a newly generated one — this env var overrides config.xml on every
# boot, so a mismatched value would rotate the key out from under every
# existing consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radarr-secret
    creationPolicy: Owner
    template:
      data:
        RADARR__AUTH__APIKEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: radarr
        property: api_key
