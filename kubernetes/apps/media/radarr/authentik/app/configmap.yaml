---
# See kubernetes/apps/media/sonarr/authentik/app/configmap.yaml for the
# pattern this follows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: radarr-authentik-blueprint
data:
  radarr.yaml: |
    version: 1
    metadata:
      name: radarr-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-radarr
        identifiers:
          name: radarr
        attrs:
          external_host: https://radarr.${SECRET_DOMAIN}
          mode: forward_single
          # The API is exempted from forward auth, deliberately. These
          # hostnames sit on envoy-internal (LAN/WireGuard only), and the
          # *arr APIs enforce their own X-Api-Key on every request, so this
          # restores exactly the pre-Authentik posture for /api while the UI
          # stays fully gated. Without it, an API client gets a 302 to the
          # Authentik login page instead of JSON -- an OAuth redirect no
          # script can follow.
          #
          # Scoped to /api and /ping on purpose: not a blanket bypass, and
          # NOT applied to sabnzbd or bazarr, whose APIs nothing outside the
          # cluster calls.
          skip_path_regex: |
            ^/api/
            ^/ping$
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          provider: !KeyOf provider-radarr
          meta_launch_url: https://radarr.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/radarr.svg
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, radarr]]
          group: !Find [authentik_core.group, [name, media]]
        attrs:
          order: 0
          enabled: true
