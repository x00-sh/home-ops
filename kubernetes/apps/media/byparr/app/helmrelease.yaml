---
# Runs a headless anti-bot-detection browser and exposes a FlareSolverr-API-
# compatible HTTP endpoint on :8191. Prowlarr's "FlareSolverr" indexer proxy
# type talks to this service to fetch a valid session/cookie for indexers
# that sit behind a JS challenge, then reuses those cookies for its own
# direct requests to the indexer.
#
# ClusterIP only, no ingress: nothing outside the cluster ever calls this
# directly, only Prowlarr does, in-namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
spec:
  chartRef:
    kind: OCIRepository
    name: byparr
  interval: 1h
  values:
    controllers:
      byparr:
        replicas: 1
        type: deployment
        containers:
          app:
            image:
              # No versioned tags are published for this image (only
              # latest/main/nightly), so this pins latest's digest as of
              # 2026-09-01 instead of a floating tag.
              repository: ghcr.io/thephaseless/byparr
              tag: latest
              digest: sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
            env:
              TZ: Europe/Amsterdam
              LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1536Mi
    service:
      app:
        controller: byparr
        ports:
          http:
            port: 8191
    persistence:
      # The headless browser's shared-memory needs; Kubernetes' default
      # /dev/shm is 64Mi regardless of the container's own memory limit,
      # which is too small for a Firefox-based renderer and causes crashes
      # under real page loads.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
