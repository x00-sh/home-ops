---
# See kubernetes/apps/media/sonarr/app/securitypolicy.yaml for the pattern
# this follows and how it was verified.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-authentik
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # `-app`, not a bare `prowlarr`: app-template suffixes every route with its
      # values key once the app declares more than one, so adding the
      # unauthenticated `api` route renamed this one. Targeting the old name
      # silently attaches the policy to nothing and leaves the UI wide open —
      # this is NOT a cosmetic rename.
      name: prowlarr-app
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-For
      - X-Real-Ip
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - kind: Service
          name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-uid
        - X-authentik-username
        - X-authentik-name
        - X-authentik-email
        - X-authentik-groups
        - X-authentik-entitlements
