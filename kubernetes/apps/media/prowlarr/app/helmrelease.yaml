---
# Indexer management for Sonarr and Radarr.
#
# Today each app holds its own hand-made NZBgeek entry, so every indexer change
# is made twice and kept in sync by hand. Prowlarr owns the list instead and
# pushes it to both.
#
# It does NOT mount the media volume: Prowlarr only ever talks to indexers and
# to the *arr APIs, and never touches a media file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: prowlarr
  interval: 1h
  values:
    controllers:
      prowlarr:
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hotio/prowlarr
              # Pinned, matching the style used for the other *arr apps. Never
              # `release` or `latest`: those float, and an indexer definition
              # schema change arriving unannounced is not something to discover
              # from a failed search.
              tag: release-2.5.2.5491
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              # Two databases, same split Sonarr/Radarr use; LOGDB name is
              # inferred by pattern from the config.xml key PostgresLogDb.
              PROWLARR__POSTGRES__HOST: prowlarr-postgres-rw
              PROWLARR__POSTGRES__PORT: "5432"
              PROWLARR__POSTGRES__USER: prowlarr
              PROWLARR__POSTGRES__MAINDB: prowlarr-main
              PROWLARR__POSTGRES__LOGDB: prowlarr-log
              PROWLARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-postgres-app
                    key: password
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9696
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 9696
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    route:
      app:
        # Internal gateway only, and this one is not a style choice: Prowlarr
        # stores the API key of every indexer it manages. It must never be
        # reachable from outside the LAN.
        hostnames:
          - "prowlarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9696
      # A SECOND HTTPRoute on the same hostname, carrying no SecurityPolicy,
      # so /api and /ping reach the app without Authentik in the way.
      #
      # This exists because Envoy Gateway's extAuth REPLACES the request path
      # when it calls the outpost (it sends /outpost.goauthentik.io/auth/envoy
      # and no X-Forwarded-Uri), so Authentik never learns the original path
      # and its own `skip_path_regex` field cannot work here — it is only
      # usable with Traefik/nginx-style forward auth, which pass the URI.
      # Splitting the route is what actually works, and it is plain Gateway
      # API rather than an EnvoyPatchPolicy.
      #
      # Gateway API resolves the overlap by match specificity, not by order:
      # the longer PathPrefix wins, so /api goes here and everything else
      # falls through to the gated route above. The API is NOT unprotected —
      # prowlarr enforces its own X-Api-Key on every request, and this hostname
      # is LAN/WireGuard-only on envoy-internal. This restores exactly the
      # pre-Authentik posture for /api while the UI stays fully gated.
      api:
        hostnames:
          - "prowlarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /ping
            backendRefs:
              - identifier: app
                port: 9696
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
