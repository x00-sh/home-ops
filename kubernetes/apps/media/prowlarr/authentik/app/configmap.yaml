---
# See kubernetes/apps/media/sonarr/authentik/app/configmap.yaml for the
# pattern this follows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-authentik-blueprint
data:
  prowlarr.yaml: |
    version: 1
    metadata:
      name: prowlarr-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-prowlarr
        identifiers:
          name: prowlarr
        attrs:
          external_host: https://prowlarr.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          provider: !KeyOf provider-prowlarr
          meta_launch_url: https://prowlarr.${SECRET_DOMAIN}
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, prowlarr]]
          group: !Find [authentik_core.group, [name, media]]
        attrs:
          order: 0
          enabled: true
