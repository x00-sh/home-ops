---
# Same shape as kubernetes/apps/media/qbittorrent/app/networkpolicy.yaml.
#
# Hard allowlist of known real server IPs, not an open range. Sourced from
# a live gluetun container's own /gluetun/servers.json, not the public
# github.com/qdm12/gluetun-servers repo — the two can drift, and Cilium
# enforcing against a stale IP silently drops all traffic to a server
# gluetun has actually connected to, while gluetun's own logs still report
# the tunnel as up. To refresh if ProtonVPN's Denmark fleet changes, pull
# from a live pod, not the public repo:
#
#   kubectl cp media/<sabnzbd-or-qbittorrent-pod>:/gluetun/servers.json \
#     -c gluetun /tmp/servers.json
#   python3 -c "
#   import json
#   d = json.load(open('/tmp/servers.json'))['protonvpn']
#   ips = sorted(set(ip for s in d['servers']
#                     if s.get('country') == 'Denmark' and s.get('vpn') == 'wireguard'
#                     for ip in s['ips']))
#   print('\n'.join(ips))
#   "
#
# Note gluetun's own iptables kill-switch inside the pod's netns is the
# primary enforcement either way (default-DROP, only the tunnel interface
# and DNS allowed) — this CiliumNetworkPolicy is the second, independent
# layer restricting which WireGuard endpoint the tunnel itself may reach,
# not a general internet-egress allowlist. Traffic still cannot leave the
# pod at all except through the tun interface or to CoreDNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sabnzbd-vpn-only
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        # Denmark WireGuard servers — see the comment above to refresh from
        # a live pod.
        - "149.50.217.161/32"
        - "149.88.109.34/32"
        - "185.111.109.1/32"
        - "185.159.158.237/32"
        - "193.29.107.98/32"
        - "193.29.107.162/32"
        - "62.169.136.238/32"
        - "62.169.136.239/32"
        - "62.169.136.37/32"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
