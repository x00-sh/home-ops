---
# Same shape as kubernetes/apps/media/qbittorrent/app/networkpolicy.yaml,
# verified there first against the live cluster before being applied here.
#
# Widened 2026-08-31 from one pinned IP to all 9 known Denmark WireGuard
# servers, alongside the same-day switch from gluetun's `custom` provider
# to native `protonvpn` + SERVER_COUNTRIES=Denmark (see helmrelease.yaml) —
# owner decision, explicitly preferring stability (automatic server
# failover) over the tighter single-IP allowlist. Still a hard allowlist of
# known real server IPs, not an open range. **Sourced from the live gluetun
# container's own /gluetun/servers.json, not the public
# github.com/qdm12/gluetun-servers repo** — the two were found to have
# already drifted by one IP when this was built: the public repo listed
# `79.135.104.93`, but the actual running v3.41.3 image's bundled list had
# `62.169.136.37` instead. Confirmed live and the hard way — gluetun
# connected to `.37`, Cilium silently dropped every packet since only the
# public-repo IP was allowlisted at first, and the tunnel looked "up" per
# gluetun's own logs while nothing could actually reach the internet. To
# refresh if ProtonVPN's Denmark fleet changes, pull from a live pod, not
# the public repo:
#
#   kubectl cp media/<sabnzbd-or-qbittorrent-pod>:/gluetun/servers.json \
#     -c gluetun /tmp/servers.json
#   python3 -c "
#   import json
#   d = json.load(open('/tmp/servers.json'))['protonvpn']
#   ips = sorted(set(ip for s in d['servers']
#                     if s.get('country') == 'Denmark' and s.get('vpn') == 'wireguard'
#                     for ip in s['ips']))
#   print('\n'.join(ips))
#   "
#
# Note gluetun's own iptables kill-switch inside the pod's netns is the
# primary enforcement either way (default-DROP, only the tunnel interface
# and DNS allowed) — this CiliumNetworkPolicy is the second, independent
# layer restricting which WireGuard endpoint the tunnel itself may reach,
# not a general internet-egress allowlist. Traffic still cannot leave the
# pod at all except through the tun interface or to CoreDNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sabnzbd-vpn-only
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        # Denmark WireGuard servers, pulled from a live gluetun pod's own
        # /gluetun/servers.json, 2026-08-31 — see the comment above to
        # refresh.
        - "149.50.217.161/32"
        - "149.88.109.34/32"
        - "185.111.109.1/32"
        - "185.159.158.237/32"
        - "193.29.107.98/32"
        - "193.29.107.162/32"
        - "62.169.136.238/32"
        - "62.169.136.239/32"
        - "62.169.136.37/32"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
