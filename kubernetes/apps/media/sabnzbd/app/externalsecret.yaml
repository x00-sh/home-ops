---
# SABnzbd has no env var for its API key or server credentials (unlike
# Sonarr/Radarr) — see helmrelease.yaml's init-config container and
# job-bootstrap-server.yaml for how these actually reach sabnzbd.ini.
#
# 1Password item `sabnzbd` in the homelab vault, fields:
#   api_key       - must match the value already live in Config > General.
#   nntp_host     - the usenet provider's server hostname.
#   nntp_port     - the usenet provider's port for the connection type below.
#   nntp_username - usenet provider account username.
#   nntp_password - usenet provider account password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: sabnzbd
        property: api_key
    - secretKey: NNTP_HOST
      remoteRef:
        key: sabnzbd
        property: nntp_host
    - secretKey: NNTP_PORT
      remoteRef:
        key: sabnzbd
        property: nntp_port
    - secretKey: NNTP_USERNAME
      remoteRef:
        key: sabnzbd
        property: nntp_username
    - secretKey: NNTP_PASSWORD
      remoteRef:
        key: sabnzbd
        property: nntp_password
