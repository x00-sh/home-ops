---
# replicas: 1 until the existing configuration has been copied into
# sabnzbd-config. Starting empty would create a fresh database that the
# migration would then have to overwrite.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        replicas: 1
        type: deployment
        strategy: Recreate
        initContainers:
          # SABnzbd has no env var for its API key, and it rewrites the whole
          # ini on every shutdown, so a live edit doesn't stick (same trap as
          # the host_whitelist fix documented in k8s-migration/docs/areas/
          # media.md). This only ever touches a volume with no sabnzbd.ini
          # yet — i.e. a fresh PVC after a from-scratch restore — so the
          # running instance's config is never at risk of being overwritten.
          # Once SABnzbd itself has booted and owns the file, this is a
          # silent no-op forever after.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - >-
                set -eu;
                if [ ! -f /config/sabnzbd.ini ]; then
                  echo "sabnzbd.ini missing, seeding api_key and host_whitelist for first boot";
                  umask 0077;
                  printf '[misc]\napi_key = %s\nhost_whitelist = sabnzbd.%s\n'
                    "$API_KEY" "$SECRET_DOMAIN" > /config/sabnzbd.ini;
                else
                  echo "sabnzbd.ini already present, leaving it untouched";
                fi
            env:
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-secret
                    key: API_KEY
              SECRET_DOMAIN: "${SECRET_DOMAIN}"
        containers:
          app:
            image:
              repository: ghcr.io/hotio/sabnzbd
              tag: release-5.1.0
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
          # Same shape as qbittorrent's gluetun sidecar — see
          # networkpolicy.yaml and externalsecret.yaml's sabnzbd-protonvpn
          # entry.
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.3
            env:
              # Native mode makes gluetun pick a new server from
              # SERVER_COUNTRIES on every restart, rather than always
              # retrying one pinned endpoint. The account's
              # WIREGUARD_PRIVATE_KEY (from `sabnzbd-protonvpn-secret`) is
              # tied to the account, not a specific server, so it works
              # unchanged under either provider mode.
              VPN_SERVICE_PROVIDER: protonvpn
              # Single country keeps the CiliumNetworkPolicy allowlist in
              # networkpolicy.yaml a small, enumerable set of real server
              # IPs, rather than opening egress to ProtonVPN's entire
              # network — see that file for the current list and how to
              # refresh it.
              SERVER_COUNTRIES: "Denmark"
              # `sabnzbd-protonvpn-secret` still carries the custom-mode
              # fields (public_key, endpoint_ip, endpoint_port) via envFrom
              # below — harmless to leave in the secret, but gluetun's
              # native provider mode actively rejects an endpoint port/IP
              # being set at all, rather than silently ignoring it.
              # Explicit `env:` entries override `envFrom` for the same key
              # in Kubernetes, so these are blanked here rather than
              # editing the shared secret/1Password item.
              WIREGUARD_ENDPOINT_IP: ""
              WIREGUARD_ENDPOINT_PORT: ""
              WIREGUARD_PUBLIC_KEY: ""
              VPN_TYPE: wireguard
              # The stored ProtonVPN secret carries only the five raw
              # WireGuard fields (private/public key, address, endpoint),
              # not ProtonVPN's full exported config — so it never includes
              # their standard `PersistentKeepalive = 25` line. Without it,
              # WireGuard sends nothing when idle, and a home router's NAT
              # mapping for the tunnel can time out, silently dropping
              # inbound replies.
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              # NIC checksum/segmentation offload can miscompute checksums
              # for large encapsulated WireGuard packets: small packets are
              # unaffected, but sustained large-packet transfers collapse
              # to a crawl, only through the containerized tunnel interface
              # — a native WireGuard client hitting the same servers is
              # unaffected. A smaller MTU keeps packets under the size that
              # triggers it, without needing to touch the host NIC driver.
              WIREGUARD_MTU: "1280"
              # 8080 is the WebUI; 9999 is gluetun's own health endpoint,
              # which the liveness probe below needs to reach through this
              # same kill-switch.
              FIREWALL_INPUT_PORTS: "8080,9999"
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              # Off: gluetun's own ICMP/DNS/TLS healthcheck can fail
              # transiently under load without the tunnel itself actually
              # being down, and each failure normally tears down and
              # re-establishes the WireGuard tunnel — killing every
              # in-flight connection on a false positive. Gluetun's own
              # kill-switch (iptables default-DROP in the netns) still
              # blocks all non-tunnel egress even with auto-restart off, so
              # this trades automatic reconnection on a real failure for
              # not repeatedly killing healthy connections on a false one.
              # A genuine outage is instead caught by the liveness probe
              # below.
              HEALTH_RESTART_VPN: "off"
              # gluetun's HEALTH_SERVER_ADDRESS defaults to
              # 127.0.0.1:9999 — loopback only. A Kubernetes httpGet
              # liveness probe connects via the pod IP, never literally
              # 127.0.0.1, so against the default it fails every check,
              # restarting the container on a permanent loop instead of
              # only on a real outage. Binding to all interfaces is safe:
              # this address is only ever reached from inside the pod's own
              # netns (kubelet's probe, or the app container), never
              # externally — no Service or Route exposes port 9999.
              HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: sabnzbd-protonvpn-secret
            # HEALTH_RESTART_VPN=off (above) stops gluetun's own internal
            # tunnel-teardown-and-rebuild, but its health checks (the
            # ICMP/DNS/TLS probes) keep running and keep updating its
            # health server at 127.0.0.1:9999 regardless — only the
            # internal tunnel-teardown action is off. Pointing Kubernetes'
            # own liveness probe at that endpoint gives a second,
            # independent restart path: one that restarts the whole
            # gluetun container, rather than relying on gluetun's own
            # internal reconnect, which does not always recover a dead
            # tunnel on its own.
            #
            # The 10-minute failure window (periodSeconds 60 x
            # failureThreshold 10) is a deliberate tradeoff: short enough
            # that an unusually long false-positive blip can trigger an
            # unnecessary restart, in exchange for faster recovery from a
            # real outage. A restart here is cheap — same-pod netns, app
            # container untouched — so that tradeoff favors speed.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 10
            # Kubernetes shares IP routing rules across a pod's whole
            # network namespace, so a container-only restart (not a full
            # pod delete) is exactly the kind of abrupt exit that can leave
            # a stale WireGuard `ip rule` behind — the new gluetun process
            # then collides with it (`adding ip rule 101: from all to all
            # table 51820: file exists`) and gets stuck retrying without
            # ever re-establishing the tunnel. This postStart hook clears
            # any stale rule before the new process tries to add its own
            # (`|| true` so a genuinely fresh pod, with no stale rule,
            # doesn't fail).
            # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            # gluetun's own DNS blocklist download/reload can spike well
            # past a couple hundred Mi — this was OOMKilled repeatedly at
            # 256Mi.
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: these were LAN-only under docker, and Authentik
        # forward auth is layered on top rather than instead of that.
        hostnames:
          - "sabnzbd.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: sabnzbd-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      gluetun-data:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            gluetun:
              - path: /gluetun
