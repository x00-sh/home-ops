---
# replicas: 1 until the existing configuration has been copied into
# sabnzbd-config. Starting empty would create a fresh database that the
# migration would then have to overwrite.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        replicas: 1
        type: deployment
        strategy: Recreate
        initContainers:
          # SABnzbd has no env var for its API key, and it rewrites the whole
          # ini on every shutdown, so a live edit doesn't stick (same trap as
          # the host_whitelist fix documented in k8s-migration/docs/areas/
          # media.md). This only ever touches a volume with no sabnzbd.ini
          # yet — i.e. a fresh PVC after a from-scratch restore — so the
          # running instance's config is never at risk of being overwritten.
          # Once SABnzbd itself has booted and owns the file, this is a
          # silent no-op forever after.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - >-
                set -eu;
                if [ ! -f /config/sabnzbd.ini ]; then
                  echo "sabnzbd.ini missing, seeding api_key and host_whitelist for first boot";
                  umask 0077;
                  printf '[misc]\napi_key = %s\nhost_whitelist = sabnzbd.%s\n'
                    "$API_KEY" "$SECRET_DOMAIN" > /config/sabnzbd.ini;
                else
                  echo "sabnzbd.ini already present, leaving it untouched";
                fi
            env:
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-secret
                    key: API_KEY
              SECRET_DOMAIN: "${SECRET_DOMAIN}"
        containers:
          app:
            image:
              repository: ghcr.io/hotio/sabnzbd
              tag: release-5.1.0
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
          # Verified against qBittorrent first (2026-08-28) before touching
          # this live instance: tunnel-up check, the actual kill-switch test
          # (tunnel deliberately broken, app egress confirmed to fail
          # completely, not fall back), iptables default-DROP allowlist, and
          # independent CiliumNetworkPolicy enforcement via cilium-dbg. Same
          # shape here verbatim. See networkpolicy.yaml and
          # externalsecret.yaml's sabnzbd-protonvpn entry.
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.3
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              FIREWALL_INPUT_PORTS: "8080"
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: sabnzbd-protonvpn-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: these were LAN-only under docker, and Authentik
        # forward auth is layered on top rather than instead of that.
        hostnames:
          - "sabnzbd.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: sabnzbd-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      gluetun-data:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            gluetun:
              - path: /gluetun
