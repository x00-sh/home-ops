---
# replicas: 1 until the existing configuration has been copied into
# sabnzbd-config. Starting empty would create a fresh database that the
# migration would then have to overwrite.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        replicas: 1
        type: deployment
        strategy: Recreate
        initContainers:
          # SABnzbd has no env var for its API key, and it rewrites the whole
          # ini on every shutdown, so a live edit doesn't stick (same trap as
          # the host_whitelist fix documented in k8s-migration/docs/areas/
          # media.md). This only ever touches a volume with no sabnzbd.ini
          # yet — i.e. a fresh PVC after a from-scratch restore — so the
          # running instance's config is never at risk of being overwritten.
          # Once SABnzbd itself has booted and owns the file, this is a
          # silent no-op forever after.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - >-
                set -eu;
                if [ ! -f /config/sabnzbd.ini ]; then
                  echo "sabnzbd.ini missing, seeding api_key and host_whitelist for first boot";
                  umask 0077;
                  printf '[misc]\napi_key = %s\nhost_whitelist = sabnzbd.%s\n'
                    "$API_KEY" "$SECRET_DOMAIN" > /config/sabnzbd.ini;
                else
                  echo "sabnzbd.ini already present, leaving it untouched";
                fi
            env:
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-secret
                    key: API_KEY
              SECRET_DOMAIN: "${SECRET_DOMAIN}"
        containers:
          app:
            image:
              repository: ghcr.io/hotio/sabnzbd
              tag: release-5.1.0
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
          # Verified against qBittorrent first (2026-08-28) before touching
          # this live instance: tunnel-up check, the actual kill-switch test
          # (tunnel deliberately broken, app egress confirmed to fail
          # completely, not fall back), iptables default-DROP allowlist, and
          # independent CiliumNetworkPolicy enforcement via cilium-dbg. Same
          # shape here verbatim. See networkpolicy.yaml and
          # externalsecret.yaml's sabnzbd-protonvpn entry.
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.3
            env:
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              # Added 2026-08-30: our ProtonVPN secret only carries the five
              # raw WireGuard fields (private/public key, address, endpoint),
              # not ProtonVPN's full exported config — so it never included
              # their standard `PersistentKeepalive = 25` line. Without it,
              # WireGuard sends nothing when idle, and the home router's NAT
              # mapping for the tunnel times out after roughly a minute,
              # silently dropping inbound replies from then on. This affected
              # two different pinned servers identically, which is what
              # pointed at a client-side gap rather than either server.
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              # Added 2026-08-30: bulk transfers through the tunnel were
              # collapsing to tens of B/s under sustained load while tiny
              # requests worked fine, and only through gluetun's containerized
              # WireGuard interface — a native WireGuard client on the same
              # network got a clean, stable 75 Mbps, and non-VPN traffic from
              # this same node was consistently fast too. That signature (fine
              # small packets, sustained large-packet flows collapse, only
              # inside the container) matches NIC offload (checksum/segmentation
              # offload) miscomputing checksums for WireGuard's encapsulated
              # UDP payload once packets get large — forcing a much smaller
              # MTU keeps packets below the size that triggers it, without
              # needing to touch the host NIC driver.
              WIREGUARD_MTU: "1280"
              # 9999 added 2026-08-31 alongside the existing 8080 (WebUI) so
              # the liveness probe below can reach gluetun's own health
              # server through its kill-switch iptables rules — same reason
              # 8080 was needed in the first place.
              FIREWALL_INPUT_PORTS: "8080,9999"
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              # Disabled 2026-08-30: the pinned ProtonVPN server (see
              # externalsecret.yaml) started failing gluetun's own ICMP/DNS/TLS
              # healthcheck every few minutes under load, and each failure
              # tears down and re-establishes the WireGuard tunnel — killing
              # every in-flight connection (this is what broke SABnzbd's
              # Newshosting connections). The "ip getter" check after every
              # one of those restarts succeeded immediately, meaning the
              # tunnel itself was never actually down — only the healthcheck's
              # probes were. Gluetun's own kill-switch (iptables default-DROP
              # in the netns) still blocks all non-tunnel egress even with
              # auto-restart off, so disabling it trades "automatically
              # reconnect on a real failure" for "stop repeatedly killing
              # healthy connections on a false positive" — see
              # docs/areas/media.md for the incident writeup.
              HEALTH_RESTART_VPN: "off"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: sabnzbd-protonvpn-secret
            # Added 2026-08-31: auto-heal for the real failure mode
            # HEALTH_RESTART_VPN=off leaves uncovered. Gluetun's own health
            # checks (the ICMP/DNS/TLS probes above) keep running and keep
            # updating its health server at 127.0.0.1:9999 even with
            # auto-restart disabled — only the internal tunnel-teardown
            # action is what's off. Pointing Kubernetes' own liveness probe
            # at that endpoint gives a second, independent restart path: one
            # that restarts the whole gluetun container (proven to actually
            # fix a dead tunnel, unlike gluetun's internal restart, which
            # didn't recover from the 2026-08-30 manual-interference case)
            # rather than gluetun's own less-reliable internal reconnect.
            #
            # 10 minutes (periodSeconds 60 x failureThreshold 10, owner
            # choice) is SHORTER than the longest false-positive blip seen so
            # far (~11 min, 2026-08-31 14:45-14:56 CEST) — a deliberate
            # tradeoff of faster auto-recovery from a real outage against a
            # small chance of an unnecessary container restart during an
            # unusually long false-positive window. A restart here is cheap
            # (same-pod netns, app container untouched) so that risk was
            # judged acceptable; revisit the threshold if unnecessary
            # restarts start showing up in practice.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 10
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: these were LAN-only under docker, and Authentik
        # forward auth is layered on top rather than instead of that.
        hostnames:
          - "sabnzbd.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: sabnzbd-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      gluetun-data:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            gluetun:
              - path: /gluetun
