---
# SABnzbd's gluetun sidecar credentials — separate file from externalsecret.yaml
# since it's a distinct concern (VPN transport vs. usenet application auth),
# even though both ultimately configure the same pod.
#
# 1Password item `protonvpn` in the homelab vault — the SAME item
# qBittorrent's ExternalSecret reads, since both are pinned to the same
# ProtonVPN server. Separate K8s Secret per app regardless, matching this
# repo's usual per-app-secret convention. See
# kubernetes/apps/media/qbittorrent/app/externalsecret.yaml and
# networkpolicy.yaml for the design rationale (verified there first).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-protonvpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-protonvpn-secret
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: protonvpn
        property: private_key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: protonvpn
        property: addresses
    - secretKey: WIREGUARD_PUBLIC_KEY
      remoteRef:
        key: protonvpn
        property: public_key
    - secretKey: WIREGUARD_ENDPOINT_IP
      remoteRef:
        key: protonvpn
        property: endpoint_ip
    - secretKey: WIREGUARD_ENDPOINT_PORT
      remoteRef:
        key: protonvpn
        property: endpoint_port
