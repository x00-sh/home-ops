---
# See kubernetes/apps/media/sonarr/authentik/app/configmap.yaml for the
# pattern this follows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sabnzbd-authentik-blueprint
data:
  sabnzbd.yaml: |
    version: 1
    metadata:
      name: sabnzbd-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-sabnzbd
        identifiers:
          name: sabnzbd
        attrs:
          external_host: https://sabnzbd.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: sabnzbd
        attrs:
          name: Sabnzbd
          provider: !KeyOf provider-sabnzbd
          meta_launch_url: https://sabnzbd.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/sabnzbd.svg
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, sabnzbd]]
          group: !Find [authentik_core.group, [name, media]]
        attrs:
          order: 0
          enabled: true
