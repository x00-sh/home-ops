---
# Config volumes are declared here rather than by each app's HelmRelease so the
# data outlives any release. Deleting or rebuilding an app must never be able to
# take its database with it.
#
# openebs-hostpath is WaitForFirstConsumer, so these stay Pending until a pod
# mounts them — including the pod used to seed them during migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
