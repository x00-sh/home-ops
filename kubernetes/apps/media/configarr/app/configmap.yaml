---
# Configarr's declarative configuration for Sonarr and Radarr.
#
# Read kubernetes/apps/media/configarr/app/cronjob.yaml for how this is
# consumed, and /opt/k8s-migration/configarr-design.md for why each choice is
# what it is. The invariants in section 4 of that document are not style
# preferences — several obvious-looking defaults actively undo deliberate work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
data:
  config.yml: |
    trashGuideUrl: https://github.com/TRaSH-Guides/Guides
    recyclarrConfigUrl: https://github.com/recyclarr/config-templates

    # The four custom formats that do not exist in TRaSH. Being able to declare
    # these alongside TRaSH ones is the entire reason this is Configarr and not
    # Recyclarr.
    #
    # Scores live in trash_scores.default and are applied wherever the format is
    # assigned. They match what is live in both apps today: +600 / +500 / -200 /
    # -10000.
    customFormatDefinitions:
      # Danish audio, but only when Danish is the title's ORIGINAL language.
      # The two specifications are an AND: a Danish dub of an English-language
      # film matches the first but not the second, so it does not outrank the
      # English original. The specification names differ only so the pairing
      # cannot be collapsed by anything keying on name.
      - trash_id: local-lang-danish-original
        name: "Language: Danish (Original)"
        trash_description: "Danish audio where Danish is the original language"
        trash_scores:
          default: 600
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: Danish
            implementation: LanguageSpecification
            negate: false
            required: true
            fields:
              value: 6
              exceptLanguage: false
          - name: Original
            implementation: LanguageSpecification
            negate: false
            required: true
            fields:
              value: -2
              exceptLanguage: false

      - trash_id: local-lang-english
        name: "Language: English"
        trash_description: "English audio"
        trash_scores:
          default: 500
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: English
            implementation: LanguageSpecification
            negate: false
            required: true
            fields:
              value: 1
              exceptLanguage: false

      - trash_id: local-dual-multi-audio
        name: "Dual / Multi Audio"
        trash_description: "Release title advertises dual or multi audio"
        trash_scores:
          default: -200
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: Release Title
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: "\\b(dual|multi)\\b"

      # The hard block. Scores -10000 against a minFormatScore floor of -1000,
      # so anything matching is rejected outright rather than merely ranked low.
      # Raising that floor above -10000 silently disables language filtering.
      - trash_id: local-unwanted-language
        name: "Unwanted Language"
        trash_description: "Neither English nor Danish, and not dual/multi"
        trash_scores:
          default: -10000
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: Not English
            implementation: LanguageSpecification
            negate: true
            required: true
            fields:
              value: 1
              exceptLanguage: false
          - name: Not Danish
            implementation: LanguageSpecification
            negate: true
            required: true
            fields:
              value: 6
              exceptLanguage: false
          - name: Not Dual or Multi
            implementation: ReleaseTitleSpecification
            negate: true
            required: true
            fields:
              value: "\\b(dual|multi)\\b"

    sonarr:
      series:
        base_url: http://sonarr.media.svc.cluster.local:8989
        api_key: !secret SONARR_API_KEY

        # Explicit absolute sizes for all 22 qualities — NEVER `type: series`.
        # TRaSH's definitions are quality-first and permit remux, which is
        # exactly the hole that turned one TNG season into 214 GB. 44 MB/min is
        # 2.0 GB for a 45-minute episode. minSize values are carried over
        # unchanged: they are what makes the 35-44 window exclude remux and
        # 2160p in practice rather than merely discourage it.
        quality_definition:
          qualities:
          - quality: "Unknown"
            min: 1
            preferred: 42.0
            max: 44.0
          - quality: "SDTV"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "WEBRip-480p"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "WEBDL-480p"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "DVD"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-480p"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-576p"
            min: 2
            preferred: 42.0
            max: 44.0
          - quality: "HDTV-720p"
            min: 3
            preferred: 42.0
            max: 44.0
          - quality: "HDTV-1080p"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "Raw-HD"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "WEBRip-720p"
            min: 3
            preferred: 42.0
            max: 44.0
          - quality: "WEBDL-720p"
            min: 3
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-720p"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "WEBRip-1080p"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "WEBDL-1080p"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-1080p"
            min: 4
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-1080p Remux"
            min: 35
            preferred: 42.0
            max: 44.0
          - quality: "HDTV-2160p"
            min: 35
            preferred: 42.0
            max: 44.0
          - quality: "WEBRip-2160p"
            min: 35
            preferred: 42.0
            max: 44.0
          - quality: "WEBDL-2160p"
            min: 35
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-2160p"
            min: 35
            preferred: 42.0
            max: 44.0
          - quality: "Bluray-2160p Remux"
            min: 35
            preferred: 42.0
            max: 44.0

        # The structural fix. With upgradeAllowed false and cutoff SDTV, Sonarr
        # treats every episode as finished: it will not search for upgrades and
        # refuses to import a better file even when one is force-fed. That is
        # why both manual campaigns needed ManualImport + RescanSeries per file.
        #
        # `qualities:` is REQUIRED, not optional. Omitting it does not mean
        # "leave the allow-list alone" — Configarr filters the whole profile out
        # with a single WARN line and reports it Unchanged, so the upgrade
        # settings below silently never apply.
        #
        # This list was generated from the live profile rather than typed, and
        # is ordered BEST FIRST: Sonarr's API returns worst-first and Configarr
        # expects the reverse, so a hand-copied list would invert the ranking.
        # Only allowed qualities appear here; anything absent becomes
        # disallowed, which is what the current profile already does.
        quality_profiles:
          - name: "Any"
            upgrade:
              allowed: true
              # The GROUP name, not WEBDL-1080p. Sonarr's profile puts
              # WEBDL-1080p and WEBRip-1080p inside a group called "WEB 1080p",
              # and a cutoff must name the group. Pointing it at the member
              # quality does not error — Configarr silently reports the profile
              # unchanged, which looks exactly like success.
              until_quality: "WEB 1080p"
              # Matches the profile's existing cutoffFormatScore of 0, so an
              # episode is finished once it reaches the quality cutoff. A high
              # value here would be a trap: the maximum achievable score is
              # 1100 (Danish 600 + English 500), so anything above that means
              # nothing ever satisfies the cutoff and Sonarr searches forever.
              until_score: 0
            min_format_score: -1000
            qualities:
              - name: "Bluray-1080p"
              - name: "WEB 1080p"
                qualities:
                  - "WEBRip-1080p"
                  - "WEBDL-1080p"
              - name: "Bluray-720p"
              - name: "WEB 720p"
                qualities:
                  - "WEBRip-720p"
                  - "WEBDL-720p"
              - name: "HDTV-1080p"
              - name: "HDTV-720p"
              - name: "DVD"
              - name: "WEB 480p"
                qualities:
                  - "WEBRip-480p"
                  - "WEBDL-480p"
              - name: "SDTV"

        custom_formats:
          - trash_ids:
              - local-lang-danish-original
              - local-lang-english
              - local-dual-multi-audio
              - local-unwanted-language
            assign_scores_to:
              - name: "Any"

          # Same six unwanted formats. Radarr's trash_ids differ from Sonarr's
          # for the identical format — they are per-app, so these cannot be
          # copied across.
          - trash_ids:
              - ed38b889b31be83fda192888e2286d83 # BR-DISK
              - 90a6f9a284dff5103f6346090e6280c8 # LQ
              - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
              - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
              - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
              - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            assign_scores_to:
              - name: "Any"

          - trash_ids:
              - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
              - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
              - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
              - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
              - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
            assign_scores_to:
              - name: "Any"

          # Scored 0 here too. Radarr has upgrades off so nothing is re-grabbed
          # either way, but a -10000 would block x265 on any NEW acquisition.
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
            assign_scores_to:
              - name: "Any"
                score: 0

          # Unwanted releases, all -10000 by default. That is below the
          # profile's minFormatScore of -1000, so these are hard blocks at grab
          # time rather than a ranking nudge — which is the intent.
          - trash_ids:
              - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
              - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
              - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
              - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
              - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
              - 06d66ab109d4d2eddb2794d21526d140 # Retags
            assign_scores_to:
              - name: "Any"

          # Release-group tiers. This is the actual quality win: the manual
          # campaign picked "largest file that still fits the cap", which is a
          # crude proxy. Tiers pick a good encode within the same size budget.
          #
          # These are large positive scores and they do NOT create upgrade
          # pressure: existing files already score at or above the profile's
          # cutoffFormatScore of 0, so they stay finished. Tiers only decide
          # which candidate wins when a grab is actually happening.
          - trash_ids:
              - d6819cba26b1a6508138d25fb5e32293 # HD Bluray Tier 01
              - c2216b7b8aa545dc1ce8388c618f8d57 # HD Bluray Tier 02
              - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
              - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
              - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
            assign_scores_to:
              - name: "Any"

          # x265 (HD), forced to 0 — NEVER TRaSH's default of -10000.
          # A 44 MB/min cap pushes hard toward efficient codecs, and much of
          # this library is x265 (MeGusta, INFINITY, D3FiL3R HEVC, iVy). At
          # -10000 every one of those releases would fall below the -1000 floor
          # and be treated as unwanted, blocking the very encodes the cap
          # selects for. Neutral, not positive: the cap does the selecting and
          # the tiers do the quality control.
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
            assign_scores_to:
              - name: "Any"
                score: 0

    # Radarr gets CUSTOM FORMATS ONLY.
    #
    # No quality_definition: the movie library is 4K-first and deliberately
    # uncapped. No quality_profiles either, and that omission is load-bearing —
    # Configarr can assign scores to a profile that exists only on the server,
    # so declaring the profile is unnecessary, and declaring it is the single
    # most damaging thing this config could do. With a 1080p cutoff Radarr would
    # start replacing 77 4K films with 1080p; with a 4K cutoff it would pull
    # ~1.3 TB against ~801 GB free.
    radarr:
      movies:
        base_url: http://radarr.media.svc.cluster.local:7878
        api_key: !secret RADARR_API_KEY

        custom_formats:
          - trash_ids:
              - local-lang-danish-original
              - local-lang-english
              - local-dual-multi-audio
              - local-unwanted-language
            assign_scores_to:
              - name: "Any"

          # Same six unwanted formats. Radarr's trash_ids differ from Sonarr's
          # for the identical format — they are per-app, so these cannot be
          # copied across.
          - trash_ids:
              - ed38b889b31be83fda192888e2286d83 # BR-DISK
              - 90a6f9a284dff5103f6346090e6280c8 # LQ
              - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
              - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
              - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
              - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            assign_scores_to:
              - name: "Any"

          - trash_ids:
              - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
              - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
              - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
              - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
              - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
            assign_scores_to:
              - name: "Any"

          # Scored 0 here too. Radarr has upgrades off so nothing is re-grabbed
          # either way, but a -10000 would block x265 on any NEW acquisition.
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
            assign_scores_to:
              - name: "Any"
                score: 0
