---
# qBittorrent's own forward-auth Provider/Application/PolicyBinding —
# deliberately separate from the shared `media` group definition in
# kubernetes/apps/media/authentik-blueprint/, so removing qBittorrent means
# deleting this directory and nothing else needs to change. Grants access to
# the `media` group (defined there); still needs an entry added to
# kubernetes/apps/security/authentik/app/blueprints.yaml's outpost.yaml
# provider list, and this ConfigMap's name added to that HelmRelease's
# blueprints.configMaps — those two are the only places a new app still has
# to touch outside its own directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-authentik-blueprint
data:
  qbittorrent.yaml: |
    version: 1
    metadata:
      name: qbittorrent-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-qbittorrent
        identifiers:
          name: qbittorrent
        attrs:
          external_host: https://qbittorrent.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          provider: !KeyOf provider-qbittorrent
          meta_launch_url: https://qbittorrent.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/qbittorrent.svg
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, qbittorrent]]
          group: !Find [authentik_core.group, [name, media]]
        attrs:
          order: 0
          enabled: true
