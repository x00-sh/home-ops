---
# Second, independent kill switch alongside gluetun's own iptables firewall
# (which blocks all non-tunnel egress in the pod's shared network
# namespace, and keeps doing so even if gluetun's own process dies, since
# the rules live in the netns, not the process) — this one is enforced by
# Cilium at the eBPF layer, outside the pod's own control entirely, so a
# bug in gluetun's firewall doesn't undermine it.
#
# Hard allowlist: DNS to CoreDNS, WireGuard UDP to known ProtonVPN Denmark
# servers, nothing else. The endpoint IPs are plaintext here deliberately —
# they identify public VPN servers, not a credential; the actual secret
# (the WireGuard private key) lives only in 1Password / the K8s Secret, see
# externalsecret.yaml.
#
# Gluetun's own iptables kill-switch inside the pod's netns is still the
# primary enforcement (default-DROP, only the tunnel and DNS allowed) —
# this restricts which WireGuard endpoint the tunnel may reach, not a
# general internet-egress allowlist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-vpn-only
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        # Denmark WireGuard servers. Pull a fresh list from a live gluetun
        # pod's own /gluetun/servers.json, not the public gluetun-servers
        # repo — the two can drift, and Cilium enforcing against a stale IP
        # silently drops traffic to a server gluetun has actually connected
        # to.
        - "149.50.217.161/32"
        - "149.88.109.34/32"
        - "185.111.109.1/32"
        - "185.159.158.237/32"
        - "193.29.107.98/32"
        - "193.29.107.162/32"
        - "62.169.136.238/32"
        - "62.169.136.239/32"
        - "62.169.136.37/32"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
