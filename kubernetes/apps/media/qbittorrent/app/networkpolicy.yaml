---
# The first CiliumNetworkPolicy in this cluster. Second, independent kill
# switch alongside gluetun's own iptables firewall (which blocks all
# non-tunnel egress in the pod's shared network namespace, and keeps doing
# so even if gluetun's own process dies, since the rules live in the netns
# not the process) — this one is enforced by Cilium at the eBPF layer,
# outside the pod's own control entirely, so a bug in gluetun's firewall
# doesn't undermine it.
#
# Hard allowlist: DNS to CoreDNS, WireGuard UDP to known ProtonVPN Denmark
# servers, nothing else. The endpoint IPs are plaintext here deliberately —
# they identify public VPN servers, not a credential; the actual secret
# (the WireGuard private key) lives only in 1Password / the K8s Secret, see
# externalsecret.yaml.
#
# Verified against the live cluster before writing this: pod label is
# app.kubernetes.io/name=qbittorrent, CoreDNS is k8s-app=kube-dns in
# kube-system, CiliumNetworkPolicy CRD is installed.
#
# Widened 2026-08-31 from one pinned IP to all 9 known Denmark WireGuard
# servers — see sabnzbd/app/networkpolicy.yaml for the full explanation
# (same-day switch to native `protonvpn` provider + SERVER_COUNTRIES for
# automatic failover, owner decision, and how to refresh this list).
# Gluetun's own iptables kill-switch inside the pod's netns is still the
# primary enforcement (default-DROP, only the tunnel and DNS allowed) —
# this restricts which WireGuard endpoint the tunnel may reach, not a
# general internet-egress allowlist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-vpn-only
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        # Denmark WireGuard servers, pulled from a live gluetun pod's own
        # /gluetun/servers.json (NOT the public gluetun-servers repo — see
        # sabnzbd/app/networkpolicy.yaml for why that distinction mattered
        # live), 2026-08-31.
        - "149.50.217.161/32"
        - "149.88.109.34/32"
        - "185.111.109.1/32"
        - "185.159.158.237/32"
        - "193.29.107.98/32"
        - "193.29.107.162/32"
        - "62.169.136.238/32"
        - "62.169.136.239/32"
        - "62.169.136.37/32"
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
