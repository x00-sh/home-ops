---
# The gluetun sidecar, together with networkpolicy.yaml, is the entire
# reason this app exists as its own deployment: qBittorrent must never reach
# the internet except through the ProtonVPN tunnel.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hotio/qbittorrent
              tag: release-5.2.3
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              WEBUI_PORT: "8080"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Sized for several concurrent torrents against NFS-backed
                # storage rather than local disk — each held connection's
                # buffering costs more memory than it would on local disk.
                memory: 2Gi
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.3
            env:
              # Native mode (vs. `custom` with one pinned endpoint) makes
              # gluetun pick a new server from SERVER_COUNTRIES on every
              # restart, giving automatic failover. The account's
              # WIREGUARD_PRIVATE_KEY is tied to the account, not a specific
              # server, so it works unchanged under either mode.
              VPN_SERVICE_PROVIDER: protonvpn
              # Single country keeps networkpolicy.yaml's egress allowlist a
              # small, enumerable set of real server IPs rather than all of
              # ProtonVPN's network — see that file for the current list and
              # how to pull a fresh one from a live gluetun pod.
              SERVER_COUNTRIES: "Denmark"
              # Native mode rejects an endpoint IP/port being set at all,
              # but the shared secret (envFrom below) still carries these
              # custom-mode fields — blank them here so they don't leak
              # through.
              WIREGUARD_ENDPOINT_IP: ""
              WIREGUARD_ENDPOINT_PORT: ""
              WIREGUARD_PUBLIC_KEY: ""
              VPN_TYPE: wireguard
              # The stored WireGuard config carries only the raw key/
              # address/endpoint fields, not ProtonVPN's usual
              # `PersistentKeepalive = 25` line — without it, an idle tunnel
              # sends nothing and a home router's NAT mapping for it can
              # time out, silently dropping inbound replies.
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              # NIC checksum/segmentation offload can miscompute checksums
              # for large encapsulated WireGuard packets, collapsing
              # sustained throughput to near zero while small packets stay
              # fine. A smaller MTU keeps packets under the size that
              # triggers it.
              WIREGUARD_MTU: "1280"
              # Gluetun's firewall applies netns-wide to every container in
              # this pod, not just to itself — without both ports
              # allowlisted here, its default kill-switch also blocks
              # inbound to qBittorrent's own WebUI (8080) and to gluetun's
              # own health endpoint the liveness probe below reaches (9999).
              FIREWALL_INPUT_PORTS: "8080,9999"
              # So DNS to CoreDNS isn't caught by the same default-deny.
              # Cilium's socketLB/kubeProxyReplacement can rewrite the DNS
              # destination before gluetun's netns-local iptables see it, so
              # the pod-CIDR-wide allowance is what's actually needed here
              # rather than CoreDNS's single ClusterIP.
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              # Off: gluetun's own healthcheck can flag a false positive and
              # tear down/rebuild the tunnel on its own, killing every
              # in-flight connection even when the tunnel was never actually
              # down. Real outages are instead caught by the liveness probe
              # below, which restarts the whole gluetun container.
              HEALTH_RESTART_VPN: "off"
              # Kubernetes' httpGet probe connects via the pod IP, never
              # literally loopback, so gluetun's own loopback-only default
              # would fail every single check and restart the container in
              # a permanent loop rather than only on a real outage.
              HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: qbittorrent-protonvpn-secret
            # HEALTH_RESTART_VPN=off (above) stops gluetun's own internal
            # tunnel-teardown-and-rebuild, but its health checks keep
            # running and keep updating its health server at
            # 127.0.0.1:9999 regardless — this points Kubernetes' own
            # liveness probe at that endpoint instead, restarting the whole
            # gluetun container on a sustained failure rather than relying
            # on gluetun's own internal reconnect, which does not always
            # recover a dead tunnel on its own.
            #
            # The 10-minute failure window (periodSeconds 60 x
            # failureThreshold 10) is short enough that an occasional false
            # positive triggers an unnecessary restart, trading that against
            # faster recovery from a real outage — a restart here is cheap,
            # since it only replaces the gluetun container within the same
            # pod, and the app container is untouched.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 10
            # Kubernetes shares IP routing rules across a pod's whole
            # network namespace, so a container-only restart (not a full
            # pod replace) can leave a stale WireGuard `ip rule` behind that
            # collides with the new process's own attempt to add it — this
            # clears any stale rule first so the restart above can actually
            # re-establish the tunnel instead of looping on `file exists`.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: same posture as sonarr/radarr/sabnzbd — LAN/
        # WireGuard-only, Authentik forward auth layered on top.
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
      # A SECOND HTTPRoute on the same hostname, carrying no SecurityPolicy,
      # so /api reaches the app without Authentik in the way — same reasoning
      # as sonarr/radarr's split route (see their helmrelease.yaml comments):
      # Envoy Gateway's extAuth replaces the request path when it calls the
      # outpost, so Authentik's skip_path_regex can't work here regardless.
      # qBittorrent enforces its own WebUI auth on every request, and this
      # hostname is LAN/WireGuard-only on envoy-internal.
      api:
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      # gluetun's own runtime state (its resolv.conf rewrite, internal
      # firewall bookkeeping) — an emptyDir, not persisted, since it's
      # rebuilt fresh on every start regardless.
      gluetun-data:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun
