---
# Verified standalone (no VPN) 2026-08-28: pod healthy, route reachable,
# Authentik-gated, Flux green cluster-wide. This step adds the gluetun
# sidecar, which — together with networkpolicy.yaml — is the entire reason
# this app exists: qBittorrent must never reach the internet except through
# the ProtonVPN tunnel. See the VPN_SERVICE_PROVIDER note below — switched
# from a single pinned server to native ProtonVPN failover on 2026-08-31.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hotio/qbittorrent
              tag: release-5.2.3
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              WEBUI_PORT: "8080"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Bumped from 1Gi 2026-08-30: OOMKill crash-loop (92 restarts/46h)
                # once Sonarr queued the whole Foundation S03 season as 10
                # concurrent torrents against the NFS-backed media share. See
                # docs/areas/media.md incident writeup.
                memory: 2Gi
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.3
            env:
              # See sabnzbd/app/helmrelease.yaml for the full explanation:
              # switched from `custom` (one pinned endpoint) to native
              # `protonvpn` on 2026-08-31 for automatic server failover,
              # owner decision after repeated instability on the single
              # pinned server. Same account WIREGUARD_PRIVATE_KEY works
              # regardless of provider mode (account-tied, not
              # server-tied) — no credential change needed.
              VPN_SERVICE_PROVIDER: protonvpn
              # Denmark only — keeps networkpolicy.yaml's allowlist to a
              # known, enumerable set of real server IPs (9 as of
              # 2026-08-31, pulled from a live gluetun pod's own
              # /gluetun/servers.json — see sabnzbd/app/networkpolicy.yaml
              # for why that source, not the public gluetun-servers repo,
              # is the one that matters) rather than all of ProtonVPN's
              # network. See sabnzbd/app/helmrelease.yaml.
              SERVER_COUNTRIES: "Denmark"
              # See sabnzbd/app/helmrelease.yaml: native mode rejects an
              # endpoint IP/port being set at all (hit live there as
              # CrashLoopBackOff), and the secret still carries these
              # custom-mode fields via envFrom. Blank pre-emptively.
              WIREGUARD_ENDPOINT_IP: ""
              WIREGUARD_ENDPOINT_PORT: ""
              WIREGUARD_PUBLIC_KEY: ""
              VPN_TYPE: wireguard
              # See sabnzbd/app/helmrelease.yaml for the full explanation:
              # our ProtonVPN secret omits ProtonVPN's usual `PersistentKeepalive
              # = 25`, so idle NAT mappings on the home router were timing out
              # and silently dropping the tunnel within about a minute.
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              # See sabnzbd/app/helmrelease.yaml for the full explanation:
              # sustained transfers through gluetun's tunnel collapsed to tens
              # of B/s (NIC offload miscomputing checksums on encapsulated
              # WireGuard packets once they get large), while a native
              # WireGuard client on the same network was fine — a smaller MTU
              # keeps packets under the size that triggers it.
              WIREGUARD_MTU: "1280"
              # Gluetun's firewall applies netns-wide to every container in
              # this pod, not just to itself — without this, its default
              # kill-switch also blocks inbound to qBittorrent's own WebUI.
              # Documented by gluetun itself as needed for Kubernetes
              # sidecars specifically.
              #
              # 9999 added 2026-08-31 so the liveness probe below can reach
              # gluetun's own health server through the same kill-switch.
              FIREWALL_INPUT_PORTS: "8080,9999"
              # So DNS to CoreDNS isn't caught by the same default-deny.
              # This cluster runs Cilium with socketLB/kubeProxyReplacement,
              # which may rewrite the DNS destination before gluetun's
              # netns-local iptables see it — verified empirically after
              # rollout (see plan file's verification steps), not assumed.
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              # Disabled 2026-08-30: see sabnzbd/app/helmrelease.yaml for the
              # full explanation — same pinned ProtonVPN server, same
              # healthcheck-triggered restart-loop killing live connections
              # while the tunnel itself was never actually down. Incident in
              # docs/areas/media.md.
              HEALTH_RESTART_VPN: "off"
              # See sabnzbd/app/helmrelease.yaml for the full explanation:
              # gluetun's HEALTH_SERVER_ADDRESS defaults to loopback-only,
              # which a Kubernetes httpGet probe (arrives via the pod IP)
              # can never reach — confirmed live via `kubectl exec ...
              # wget` to both addresses. Without this, the liveness probe
              # below would fail every single check forever, restarting the
              # container on a loop instead of only on a real outage.
              HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: qbittorrent-protonvpn-secret
            # Added 2026-08-31: see sabnzbd/app/helmrelease.yaml for the full
            # explanation. HEALTH_RESTART_VPN=off stops gluetun's own
            # internal tunnel-teardown-and-rebuild, but its health checks
            # keep running and keep updating its health server at
            # 127.0.0.1:9999 regardless — this points Kubernetes' own
            # liveness probe at that endpoint instead, restarting the whole
            # gluetun container (the action that's actually fixed a dead
            # tunnel twice now) rather than relying on gluetun's own
            # internal reconnect. See sabnzbd/app/helmrelease.yaml for why
            # the 10-minute threshold (periodSeconds 60 x failureThreshold
            # 10, owner choice) is actually SHORTER than the longest
            # false-positive blip observed so far — a deliberate tradeoff,
            # not an oversight.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 10
            # See sabnzbd/app/helmrelease.yaml for the full explanation: the
            # liveness probe above fired for real on sabnzbd the same day
            # and got stuck in a retry loop (`ip rule ... file exists`)
            # because a container-only restart doesn't clear the pod's
            # shared network namespace the way a full pod delete does.
            # Applying the same fix here pre-emptively, before qBittorrent's
            # own liveness probe ever fires for real.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: same posture as sonarr/radarr/sabnzbd — LAN/
        # WireGuard-only, Authentik forward auth layered on top.
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
      # A SECOND HTTPRoute on the same hostname, carrying no SecurityPolicy,
      # so /api reaches the app without Authentik in the way — same reasoning
      # as sonarr/radarr's split route (see their helmrelease.yaml comments):
      # Envoy Gateway's extAuth replaces the request path when it calls the
      # outpost, so Authentik's skip_path_regex can't work here regardless.
      # qBittorrent enforces its own WebUI auth on every request, and this
      # hostname is LAN/WireGuard-only on envoy-internal.
      api:
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      # gluetun's own runtime state (its resolv.conf rewrite, internal
      # firewall bookkeeping) — an emptyDir, not persisted, since it's
      # rebuilt fresh on every start regardless.
      gluetun-data:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun
