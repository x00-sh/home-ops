---
# Verified standalone (no VPN) 2026-08-28: pod healthy, route reachable,
# Authentik-gated, Flux green cluster-wide. This step adds the gluetun
# sidecar, which — together with networkpolicy.yaml — is the entire reason
# this app exists: qBittorrent must never reach the internet except through
# the ProtonVPN tunnel. See VPN_SERVICE_PROVIDER=custom note below for why
# that's not the `protonvpn` provider value.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/hotio/qbittorrent
              tag: release-5.2.3
            env:
              TZ: Europe/Amsterdam
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              WEBUI_PORT: "8080"
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
          gluetun:
            dependsOn: app
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.1
            env:
              # `custom`, not `protonvpn`: the `protonvpn` provider value
              # resolves a server hostname dynamically at connect time,
              # which defeats the point of pinning one static endpoint IP
              # for networkpolicy.yaml's allowlist. `custom` takes the
              # endpoint literally from the env vars below instead.
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              # Gluetun's firewall applies netns-wide to every container in
              # this pod, not just to itself — without this, its default
              # kill-switch also blocks inbound to qBittorrent's own WebUI.
              # Documented by gluetun itself as needed for Kubernetes
              # sidecars specifically.
              FIREWALL_INPUT_PORTS: "8080"
              # So DNS to CoreDNS isn't caught by the same default-deny.
              # This cluster runs Cilium with socketLB/kubeProxyReplacement,
              # which may rewrite the DNS destination before gluetun's
              # netns-local iptables see it — verified empirically after
              # rollout (see plan file's verification steps), not assumed.
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16"
              TZ: Europe/Amsterdam
            envFrom:
              - secretRef:
                  name: qbittorrent-protonvpn-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 8080
    route:
      app:
        # Internal gateway: same posture as sonarr/radarr/sabnzbd — LAN/
        # WireGuard-only, Authentik forward auth layered on top.
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
      # A SECOND HTTPRoute on the same hostname, carrying no SecurityPolicy,
      # so /api reaches the app without Authentik in the way — same reasoning
      # as sonarr/radarr's split route (see their helmrelease.yaml comments):
      # Envoy Gateway's extAuth replaces the request path when it calls the
      # outpost, so Authentik's skip_path_regex can't work here regardless.
      # qBittorrent enforces its own WebUI auth on every request, and this
      # hostname is LAN/WireGuard-only on envoy-internal.
      api:
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      # gluetun's own runtime state (its resolv.conf rewrite, internal
      # firewall bookkeeping) — an emptyDir, not persisted, since it's
      # rebuilt fresh on every start regardless.
      gluetun-data:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun
