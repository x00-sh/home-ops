---
# Forward auth via Authentik's embedded outpost. Targets this app's own
# chart-rendered HTTPRoute (same namespace requirement Gateway API enforces
# for route-level policy attachment) rather than the Gateway, so apps that
# don't want this stay untouched. Path and header lists copied from the
# already-verified sonarr/radarr pattern — see
# kubernetes/apps/media/qbittorrent/authentik/ for the matching Provider.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: qbittorrent-authentik
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # `-app`, not a bare `qbittorrent`: app-template suffixes every route
      # with its values key once the app declares more than one, so adding
      # the unauthenticated `api` route renamed this one. Targeting the old
      # name silently attaches the policy to nothing and leaves the UI wide
      # open — this is NOT a cosmetic rename (see sonarr/radarr/prowlarr's
      # identical comment; verified the same trap applies here).
      name: qbittorrent-app
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-For
      - X-Real-Ip
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - kind: Service
          name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-uid
        - X-authentik-username
        - X-authentik-name
        - X-authentik-email
        - X-authentik-groups
        - X-authentik-entitlements
