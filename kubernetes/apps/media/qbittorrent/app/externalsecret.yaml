---
# The ProtonVPN WireGuard credentials for qBittorrent's gluetun sidecar,
# pinned to one specific server (see networkpolicy.yaml for why: a static
# endpoint IP is what makes an auditable egress allowlist possible, at the
# cost of no automatic failover if that one server has an outage).
#
# 1Password item `protonvpn` in the homelab vault, shared with SABnzbd's own
# ExternalSecret since both point at the same pinned server — separate K8s
# Secrets per app regardless, matching this repo's usual per-app-secret
# convention. Fields: private_key, addresses, public_key, endpoint_ip,
# endpoint_port. No preshared_key field — this ProtonVPN export didn't
# include one, and gluetun treats an empty value differently from an unset
# one, so the key is omitted entirely rather than set to "".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-protonvpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbittorrent-protonvpn-secret
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: protonvpn
        property: private_key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: protonvpn
        property: addresses
    - secretKey: WIREGUARD_PUBLIC_KEY
      remoteRef:
        key: protonvpn
        property: public_key
    - secretKey: WIREGUARD_ENDPOINT_IP
      remoteRef:
        key: protonvpn
        property: endpoint_ip
    - secretKey: WIREGUARD_ENDPOINT_PORT
      remoteRef:
        key: protonvpn
        property: endpoint_port
