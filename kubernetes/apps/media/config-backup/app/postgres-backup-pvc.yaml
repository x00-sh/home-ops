---
# One shared PVC, one subdirectory per app, same pattern as
# media-config-restic above but for pg_dump output instead of restic
# repositories — one place to look for every app's database backups,
# without requiring a shared Postgres instance (see areas/media.md for why
# those are kept separate).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-postgres-backup
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 10Gi
