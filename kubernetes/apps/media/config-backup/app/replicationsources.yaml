---
# Nightly restic backups of the six application config volumes.
#
# These volumes exist nowhere else — not in git, not backed by a database
# with its own backup, not on the NAS. A single-node cluster has no
# redundancy to fall back on if the disk holding them fails, so this is
# their only copy outside the live volume.
#
# copyMethod is Direct because neither storage class here supports CSI
# snapshots, so the mover reads the live volume. That is safe for flat files
# and JSON, but a SQLite database can be caught mid-write. The *arr apps each
# write a consistent backup zip into /config/Backups on their own schedule and
# those zips are copied too, so a torn live database is still recoverable from
# the zip beside it. Keep those internal backups enabled.
#
# Schedules are staggered: each sync starts a mover pod, and this node has one
# disk to give.
#
# The specs are written out per application rather than shared through a YAML
# anchor, because anchors do not cross document boundaries.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: sonarr-config
spec:
  sourcePVC: sonarr-config
  trigger:
    schedule: "0 1 * * *"
  restic:
    repository: sonarr-config-restic
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheCapacity: 2Gi
    cacheStorageClassName: openebs-hostpath
    cacheAccessModes: ["ReadWriteOnce"]
    # Match the PUID/PGID the applications run as, so the mover can read what
    # it copies and owns what it writes.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    # The repository, mounted at /mnt/repo in the mover pod; RESTIC_REPOSITORY
    # in each secret points at a subdirectory of it.
    moverVolumes:
      - mountPath: repo
        volumeSource:
          persistentVolumeClaim:
            claimName: media-config-restic
