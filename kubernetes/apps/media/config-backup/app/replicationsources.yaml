    cacheAccessModes: ["ReadWriteOnce"]
    # Match the PUID/PGID the applications run as, so the mover can read what
    # it copies and owns what it writes.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    # The repository, mounted at /mnt/repo in the mover pod; RESTIC_REPOSITORY
