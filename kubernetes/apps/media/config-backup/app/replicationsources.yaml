# jellyfin-cache is deliberately absent: regenerable artwork and transcode
# scratch, which would cost more to back up nightly than to rebuild.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jellyfin-config
spec:
  sourcePVC: jellyfin-config
  trigger:
    schedule: "50 1 * * *"
  restic:
    repository: jellyfin-config-restic
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
