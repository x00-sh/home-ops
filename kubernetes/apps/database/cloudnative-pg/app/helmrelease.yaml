---
# The Postgres operator only. Individual Cluster resources live next to the app
# that owns them, so a database is never orphaned from its consumer.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 1h
  values:
    crds:
      create: true
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 256Mi
