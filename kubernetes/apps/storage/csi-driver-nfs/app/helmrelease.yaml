---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  interval: 1h
  values:
    controller:
      runOnControlPlane: true
      # No VolumeSnapshot CRDs in this cluster; the sidecar would crash-loop
      enableSnapshotter: false
      logLevel: 2
    node:
      logLevel: 2
