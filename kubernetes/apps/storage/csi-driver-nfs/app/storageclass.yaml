---
# Backup target for Volsync/restic and database dumps.
#
# The NAS is addressed by IP on purpose: a hostname would make every mount
# depend on DNS being up, and mounts happen early enough that this is a real
# ordering risk.
#
# Retain + onDelete=retain means neither deleting the PVC nor the PV removes
# the data on the NAS. Backups should never be destroyed by a cluster-side
# mistake, which is the whole point of them.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-backup
provisioner: nfs.csi.k8s.io
parameters:
  server: 10.0.0.20
  # A subdirectory, not the share root: that share also holds unrelated
  # personal data, and cluster-generated volumes should not be mixed into it.
  share: /volume2/backup/k8s
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
# nfsvers=4.0 is the highest the NAS accepts — 4.1 and 4.2 both fail the mount
# with "Protocol not supported". Do not "upgrade" this without testing.
#
# v3 is not an option and must never be used here: Talos ships no rpc.statd, so
# a v3 mount only succeeds with `nolock`, which disables file locking outright
# and will corrupt the SQLite databases these volumes are meant to protect.
# v4.0 carries locking in the protocol itself and needs no statd.
mountOptions:
  - nfsvers=4.0
  - hard
  - noatime
  - rsize=131072
  - wsize=131072
