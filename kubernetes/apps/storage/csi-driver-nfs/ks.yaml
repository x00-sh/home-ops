---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: csi-driver-nfs
      namespace: storage
  # StorageClass.parameters is immutable, so editing the share or server would
  # otherwise wedge this Kustomization on "field is immutable" until someone
  # deletes the class by hand. force lets Flux replace it instead.
  force: true
  interval: 1h
  path: ./kubernetes/apps/storage/csi-driver-nfs/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  wait: true
