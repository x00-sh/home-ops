# Consumed with envFrom, so these KEY NAMES are the environment variable names
# Headlamp reads — not arbitrary labels.
#
# The chart's config.oidc.secret.name path looks like it would take an existing
# secret, but its template only emits the env block when secret.create is true,
# so that route silently produces a pod with no OIDC configuration at all and a
# login screen asking for a pasted token. externalSecret is the working path.
#
# The client secret is the same value Authentik holds in the security
# namespace; secrets cannot cross namespaces, so rotating means changing both.
