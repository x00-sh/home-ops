---
# Click-through cluster UI. Logs in through Authentik and then talks to the
# Kubernetes API as *the user*, which is why the API server had to be taught to
# trust the Authentik issuer (talos/control-plane/10-oidc.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  chart:
    spec:
      chart: headlamp
      version: 0.44.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  interval: 1h
  values:
    replicaCount: 1
    config:
      oidc:
        secret:
          # Supplied by secret.sops.yaml rather than rendered from values, so
          # the client secret never passes through a Helm release.
          create: false
          name: headlamp-oidc
    # The chart binds its ServiceAccount to cluster-admin by default. That is
    # both unnecessary — with OIDC the user's own token authorises every call —
    # and dangerous, since anything that ever reached this pod would inherit it.
    clusterRoleBinding:
      create: false
    # HTTPRoute is hand-written in httproute.yaml.
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
