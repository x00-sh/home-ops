---
# Public, gated on Authentik OIDC login restricted to the headlamp-users
# group (../authentik/ — see the PolicyBinding there). Headlamp can read
# most of the cluster, so this was a deliberate, later step, not the default
# — see authentik-forward-auth.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "dash.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
