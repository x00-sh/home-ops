---
# What a logged-in user is allowed to do.
#
# `oidc:headlamp-users` is the Authentik group `headlamp-users` as Kubernetes
# sees it — the prefix comes from the API server's oidc-groups-prefix and keeps
# OIDC identities from colliding with ServiceAccounts or certificate subjects.
#
# `view` is the built-in read-only role. It deliberately excludes Secrets, so a
# browser session left open cannot be used to read credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-users-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:headlamp-users"
