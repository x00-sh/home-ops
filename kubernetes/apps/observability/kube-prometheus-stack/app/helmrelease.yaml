---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  # First install pulls the operator, Prometheus, Alertmanager, Grafana,
  # kube-state-metrics and node-exporter before anything reports ready.
  timeout: 15m
  values:
    # The Prometheus Operator CRDs are installed out-of-band at bootstrap
    # (bootstrap/helmfile/crds.yaml, kept in step with the operator version
    # this chart ships). Letting the chart own them too would give the same
    # CRDs two owners.
    crds:
      enabled: false

    defaultRules:
      rules:
        # kube-proxy does not exist here — Cilium replaces it (proxy.disabled
        # in the Talos config). Left on, KubeProxyDown alerts forever on a job
        # that can never have a target.
        kubeProxy: false
      disabled:
        # Fires for any container with a modest CPU limit and normal bursty
        # behaviour. On a single node with no CPU pressure it is noise, and an
        # alert that cries wolf is worse than no alert.
        CPUThrottlingHigh: true
        # NodeNetworkInterfaceFlapping is deliberately NOT disabled here, even
        # though Cilium's lxc* interface churn can trip it. It is the only rule
        # in its group, and `disabled` empties the group rather than removing
        # it, which the PrometheusRule CRD rejects (rules must be an array).
        # If it turns out noisy, silence it in Alertmanager instead.

    alertmanager:
      # Routes and receivers land in a later step; until then the chart's
      # default null receiver swallows everything, so nothing can page.
      alertmanagerSpec:
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

    grafana:
      # Deliberately stateless: dashboards come from the chart and from
      # ConfigMaps the sidecar picks up, so there is nothing here worth backing
      # up and the pod can be thrown away at any time.
      persistence:
        enabled: false
      admin:
        existingSecret: grafana-secret
      defaultDashboardsTimezone: Europe/Amsterdam
      # Grafana maps GF_<SECTION>_<KEY> onto its config, so the client secret
      # reaches the OIDC settings without ever appearing in grafana.ini.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-secret
            key: oidc-client-secret
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        analytics:
          check_for_updates: false
          reporting_enabled: false
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          # `profile` carries the groups claim that role_attribute_path reads.
          scopes: openid profile email
          auth_url: https://auth.${SECRET_DOMAIN}/application/o/authorize/
          token_url: https://auth.${SECRET_DOMAIN}/application/o/token/
          api_url: https://auth.${SECRET_DOMAIN}/application/o/userinfo/
          # Membership of grafana-admins in Authentik decides the role, so
          # access is granted and revoked there rather than inside Grafana.
          role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'
          allow_sign_up: true
          use_pkce: true
        auth:
          # The local admin stays reachable at /login for the case this whole
          # path is what is broken.
          oauth_auto_login: false
          disable_login_form: false
      # HTTPRoute is written by hand in httproute.yaml, as elsewhere in this
      # repo.
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    # Talos runs etcd as a host service rather than a static pod, so there is
    # no pod for a selector to match — point the scrape at the node directly.
    # Metrics are plain HTTP on 2381 (listen-metrics-urls in the Talos config),
    # so no client certificates are involved.
    kubeEtcd:
      endpoints: ["10.0.0.156"]

    kubelet:
      serviceMonitor:
        # cAdvisor stamps its own timestamps, and when the node is busy its
        # housekeeping falls behind the 10s scrape — so the same stale sample is
        # returned twice and Prometheus drops the second as out of order (~10
        # samples/s observed while Jellyfin was transcoding). Taking the scrape
        # time instead removes the problem entirely; the accuracy this trades
        # away is invisible at 30s resolution.
        honorTimestamps: false
        # With honorTimestamps off there is nothing to gain from scraping faster
        # than cAdvisor actually updates. container_* is by far the largest
        # metric family here, and the Prometheus volume cannot be expanded, so
        # thirding its sample count is worth more than 10s granularity.
        cAdvisorInterval: 30s
        resourceInterval: 30s

    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 90d
        # Below the 50Gi volume, so Prometheus drops the oldest blocks before
        # the filesystem fills. openebs-hostpath cannot expand a PVC, so
        # running out of space here means recreating the volume.
        retentionSize: 42GB
        # Without these, the operator only picks up objects carrying this
        # release's labels — which would silently exclude the PodMonitor that
        # envoy-gateway already ships, and everything added by later steps.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
      ingress:
        enabled: false

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
