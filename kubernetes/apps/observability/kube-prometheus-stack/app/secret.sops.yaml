# The Healthchecks.io ping URL, mounted into Alertmanager via
# alertmanagerSpec.secrets and read with webhook_config's `url_file`.
# Alertmanager does no environment substitution in its config, so a mounted
# file is the only way to keep this URL out of git in plaintext.
#
# This is the dead-man's switch: the always-firing Watchdog alert pings this
# every 5 minutes, and Healthchecks.io raises the alarm when the pings STOP.
# It is the only alerting path that survives the node dying, because every
# other one runs on the node.
