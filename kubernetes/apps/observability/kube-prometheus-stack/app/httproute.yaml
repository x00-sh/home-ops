---
# Prometheus deliberately gets no route at all — it is queried through
# Grafana, and it has no authentication of its own.
#
# Public. Grafana gates on its own native Authentik OIDC login (./authentik/)
# and Alertmanager on Authentik forward auth (../authentik-alertmanager/) —
# see authentik-forward-auth.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "alerts.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
