---
# node_exporter runs directly on both Proxmox hosts, not inside any guest —
# the host and its guests are different failure domains that can diverge: a
# guest's own kernel can keep reporting healthy metrics while the host
# underneath it has already gone dark. A static target rather than a
# PodMonitor/ServiceMonitor because there is no Kubernetes object to
# select: it's bare metal on the LAN. `instance` (the target address) is
# enough to tell the two hosts apart — no relabeling needed for just two
# targets.
#
# Exists purely for forensics, not live alerting — Healthchecks.io already
# owns "is the cluster up" (see networking.md). The point is that a host
# freeze leaves a temperature/load graph on disk instead of only a
# post-recovery reconstruction from journalctl and smartctl. This shares
# the same failure mode as everything else here (the NUC's own NVMe stops
# if the host freezes, taking this Prometheus down with it too), but the
# PVC surviving a host crash with no data loss is what makes it worth
# having regardless. infra1 (10.0.0.2, dev VM + OPNsense) sits behind a
# completely independent host, so it keeps reporting either way.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-hosts
spec:
  staticConfigs:
    - targets:
        - 10.0.0.5:9100 # NUC — runs this cluster
        - 10.0.0.2:9100 # infra1 — dev VM + OPNsense
  metricsPath: /metrics
  scrapeInterval: 30s
