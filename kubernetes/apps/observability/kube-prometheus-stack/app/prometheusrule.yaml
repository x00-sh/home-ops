---
# Homelab-specific alert rules, as opposed to the chart's generic ones.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-rules
spec:
  groups:
    - name: homelab-storage
      rules:
        # The media library runs permanently near-full and is not expected to be
        # trimmed further, so the percentage-based upstream rules are opted out
        # (see the excluded-from-alerts label on the PVC) and replaced by an
        # absolute floor: what matters is whether there is room for the next few
        # downloads, not what fraction of 11 TiB is left.
        - alert: MediaLibraryLowOnSpace
          expr: |
            kubelet_volume_stats_available_bytes{job="kubelet", namespace="media", persistentvolumeclaim="media"}
              < 200 * 1024^3
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Media library is running low on space
            description: >-
              Only {{ $value | humanize1024 }}B free on the NFS media library.
              Below 100 GiB this escalates to critical.
        - alert: MediaLibraryCriticallyLowOnSpace
          expr: |
            kubelet_volume_stats_available_bytes{job="kubelet", namespace="media", persistentvolumeclaim="media"}
              < 100 * 1024^3
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: Media library is nearly full
            description: >-
              Only {{ $value | humanize1024 }}B free on the NFS media library.
              SABnzbd will start failing imports once it cannot unpack.

    - name: homelab-gitops
      rules:
        # Companion to relying more on Renovate automerge: Flate (CI) only
        # catches build-time breakage before merge, not a Kustomization or
        # HelmRelease that fails to actually apply once it reaches the
        # cluster. This is the same signal `flux get ks/hr` shows by hand,
        # just proactive. It does NOT catch an app that applies cleanly but
        # then crash-loops — that's KubePodCrashLooping (already enabled,
        # part of the chart's default rules) covering the other half.
        - alert: FluxControllerReconcileErrors
          expr: |
            sum by (pod) (rate(controller_runtime_reconcile_errors_total{namespace="flux-system"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A Flux controller has been failing to reconcile for 15+ minutes
            description: >-
              {{ $labels.pod }} has a nonzero reconcile-error rate. Run
              `flux get ks -A` / `flux get hr -A` to find which
              Kustomization or HelmRelease is stuck.
