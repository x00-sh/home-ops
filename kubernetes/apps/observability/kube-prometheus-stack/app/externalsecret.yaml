---
# Grafana's local admin account. It is deliberately kept as break-glass access
# only — normal logins go through Authentik once OIDC lands — but it has to
# exist, because a Grafana with no local admin cannot be recovered when
# Authentik itself is the thing that is broken.
#
# Requires an item named `grafana` in the `homelab` vault with fields
# `admin_user` and `admin_password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-secret
    creationPolicy: Owner
    template:
      data:
        # Key names the Grafana chart looks for by default
        admin-user: "{{ .admin_user }}"
        admin-password: "{{ .admin_password }}"
        # Same 1Password item Authentik's blueprint reads, so the two ends of
        # the OIDC handshake cannot drift apart.
        oidc-client-secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: admin_user
      remoteRef:
        key: grafana
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: grafana
        property: admin_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: grafana-oidc
        property: client_secret
