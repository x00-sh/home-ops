---
# Moved here from kubernetes/apps/security/authentik/app/blueprints.yaml —
# see kubernetes/apps/media/sonarr/authentik/ for the general pattern this
# follows. One difference from the media/home-automation apps: grafana-admins
# is not shared with any other app, so unlike `media`/`home-automation` there
# is no separate namespace-level group file — the group lives right here,
# fully self-contained with the rest of Grafana's own OIDC config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-authentik-blueprint
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-oidc
    entries:
      # Membership in this group is what makes someone a Grafana admin; the
      # role mapping in Grafana's config keys off the group name.
      - model: authentik_core.group
        id: group-grafana-admins
        identifiers:
          name: grafana-admins
        attrs:
          is_superuser: false

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-grafana
        identifiers:
          name: grafana
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          # Must be stated explicitly. The UI pre-fills these, but a blueprint
          # that omits the field leaves it empty, and Authentik then rejects
          # every authorize request with "invalid_request" before it even looks
          # at the user.
          grant_types:
            - authorization_code
            - refresh_token
          # Implicit consent: no "do you allow this app" screen for a service
          # that is only ever used by its own owner.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.${SECRET_DOMAIN}/login/generic_oauth
          # `profile` is what carries the groups claim, so it is required for
          # the admin role mapping to work — not merely cosmetic.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider-grafana
          meta_launch_url: https://grafana.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/grafana.svg
          policy_engine_mode: any
