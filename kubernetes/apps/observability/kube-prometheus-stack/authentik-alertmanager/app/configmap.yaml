---
# Alertmanager's own forward-auth Provider/Application/PolicyBinding —
# deliberately separate from the shared `observability` group definition in
# kubernetes/apps/observability/authentik-blueprint/, so removing Alertmanager
# means deleting this directory and nothing else needs to change. Grants
# access to the `observability` group (defined there); still needs an entry
# added to kubernetes/apps/security/authentik/app/blueprints.yaml's
# outpost.yaml provider list, and this ConfigMap's name added to that
# HelmRelease's blueprints.configMaps — those two are the only places a new
# app still has to touch outside its own directory. See
# kubernetes/apps/observability/gatus/authentik/ for the pattern this
# follows; unlike Gatus, Alertmanager's own directory is shared with
# Grafana's OIDC config, hence the `authentik-alertmanager` name instead of
# a plain `authentik/` to avoid colliding with ../authentik/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-authentik-blueprint
data:
  alertmanager.yaml: |
    version: 1
    metadata:
      name: alertmanager-forward-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-alertmanager
        identifiers:
          name: alertmanager
        attrs:
          external_host: https://alerts.${SECRET_DOMAIN}
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf provider-alertmanager
          meta_launch_url: https://alerts.${SECRET_DOMAIN}
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/alertmanager.svg
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, alertmanager]]
          group: !Find [authentik_core.group, [name, observability]]
        attrs:
          order: 0
          enabled: true
