---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-authentik-blueprint
spec:
  # A separate Kustomization from ../ks.yaml (not just a separate file) is
  # required, not stylistic: that one targets `observability`, and
  # targetNamespace applies to everything a Kustomization deploys. This one
  # exists purely to target `security` instead, for a ConfigMap
  # authentik-worker mounts by name — see
  # kubernetes/apps/observability/authentik-blueprint/ks.yaml. Deliberately
  # nested under gatus/ rather than living beside the other namespace-level
  # authentik-blueprint directories: removing gatus entirely means deleting
  # this directory too, with no separate cleanup step to forget.
  interval: 1h
  path: ./kubernetes/apps/observability/gatus/authentik/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: true
