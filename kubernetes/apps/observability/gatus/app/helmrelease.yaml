---
# Black-box uptime checks: does the thing answer, from the outside, the way a
# user would meet it. That is a different question from Prometheus's "is the pod
# healthy", and the two fail independently — a running pod behind a broken
# gateway looks fine to Prometheus and dead to Gatus.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chart:
    spec:
      chart: gatus
      version: 1.5.0
      sourceRef:
        kind: HelmRepository
        name: twin
  interval: 1h
  values:
    image:
      tag: v5.28.0
    envFrom:
      - secretRef:
          name: gatus-secret
    env:
      # CloudNativePG generates and rotates this; read it where it lives.
      POSTGRES_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: gatus-postgres-app
            key: password
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    # HTTPRoute is hand-written in httproute.yaml, as elsewhere in this repo.
    ingress:
      enabled: false
    config:
      storage:
        type: postgres
        # $${...} escapes Flux's postBuild substitution so the literal
        # ${POSTGRES_PASSWORD} survives into the config file, where Gatus
        # expands it from the environment. Without the escape Flux would
        # substitute it first and silently leave an empty password.
        path: "postgres://gatus:$${POSTGRES_PASSWORD}@gatus-postgres-rw:5432/gatus?sslmode=disable"

      alerting:
        ntfy:
          url: https://ntfy.sh
          # Escaped so Flux's substitution leaves it for Gatus to expand from
          # the environment; the name itself is the credential and stays out of
          # this public repository.
          topic: $${NTFY_TOPIC}
          priority: 4
          default-alert:
            # Three consecutive failures before shouting: a single missed check
            # during a rollout is not an outage.
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true

      endpoints:
        # --- media, LAN only, via the internal gateway. All five now sit
        # behind Authentik forward auth (SecurityPolicy ext_authz), so an
        # unauthenticated check gets a 302 to auth.${SECRET_DOMAIN}, not a 200
        # from the app itself — [STATUS] < 400 already tolerates that. Not a
        # weaker check: it now also proves the SecurityPolicy, the embedded
        # outpost and Authentik itself are all reachable, which the old
        # "app answered 200" check said nothing about. ---
        - name: sonarr
          group: media
          url: https://sonarr.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: radarr
          group: media
          url: https://radarr.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: bazarr
          group: media
          url: https://bazarr.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: sabnzbd
          group: media
          url: https://sabnzbd.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: prowlarr
          group: media
          # Owns the indexer list for both Sonarr and Radarr, so when this is
          # down nothing can be searched for — even though both apps stay up
          # and look healthy.
          url: https://prowlarr.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]

        # --- published, so these also prove the Cloudflare tunnel end to end:
        # the request leaves the network, resolves publicly and comes back in ---
        - name: jellyfin
          group: published
          url: https://stream.${SECRET_DOMAIN}
          interval: 1m
          # No certificate check: through the tunnel these present Cloudflare's
          # edge certificate, not one we issue or renew.
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: seerr
          group: published
          url: https://request.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: authentik
          group: published
          url: https://auth.${SECRET_DOMAIN}
          interval: 1m
          # Split-horizon DNS points this at the Envoy gateway, so unlike the
          # two above it presents OUR certificate — making this the one place
          # cert renewal is actually observable.
          #
          # The threshold is 24h, not the more usual 10 days: the ClusterIssuer
          # uses Let's Encrypt's `shortlived` profile, so certificates live 6.7
          # days total and cert-manager renews with ~53h left. Anything above
          # ~53h would fire permanently and mean nothing.
          conditions:
            - "[STATUS] < 400"
            - "[CERTIFICATE_EXPIRATION] > 24h"
          alerts: [{ type: ntfy }]

        # --- the monitoring stack itself. Overlaps with Prometheus's own pod
        # health alerts on purpose: those depend on Prometheus being up, and
        # these do not. The two fail independently, which is the point. ---
        - name: grafana
          group: observability
          url: https://grafana.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: alertmanager
          group: observability
          url: https://alerts.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: prometheus
          group: observability
          # No route of its own, so this goes straight to the service.
          url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/-/healthy
          interval: 1m
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: ntfy }]
        - name: loki
          group: observability
          url: http://loki.observability.svc.cluster.local:3100/ready
          interval: 1m
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: ntfy }]
        - name: alloy
          group: observability
          url: http://alloy.observability.svc.cluster.local:12345/-/ready
          interval: 1m
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: ntfy }]
        - name: headlamp
          group: observability
          url: https://dash.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: vector
          group: observability
          # Talos ships its system logs here; if it is down they are simply
          # lost, with nothing else to notice.
          url: "tcp://vector.observability.svc.cluster.local:6000"
          interval: 1m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        - name: ntfy bridge
          group: observability
          # If this is down, cluster-health alerts silently go nowhere — so it
          # is checked on the service-down topic, which does not depend on it.
          url: "tcp://ntfy-alertmanager.observability.svc.cluster.local:8080"
          interval: 1m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]

        # --- home automation. These are the ones that matter at 2am: when
        # this group goes red the lights stop working. ---
        - name: mqtt
          group: home
          # Every MQTT client in the house depends on this one broker — Home
          # Assistant, Zigbee2MQTT and Frigate — so it fails wider than
          # anything else in the namespace.
          url: "tcp://mqtt.home-automation.svc.cluster.local:1883"
          interval: 1m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        # Both went live in the same commit that migrated the apps, 2026-08-18.
        - name: home assistant
          group: home
          url: https://homeassistant.${SECRET_DOMAIN}
          interval: 1m
          # No certificate check: through the tunnel this presents Cloudflare's
          # edge certificate, not one we issue.
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: zigbee2mqtt
          group: home
          # Behind Authentik forward auth too — see the media group's comment
          # above. Home Assistant is not: its own login stays in front of it,
          # unrelated to this.
          url: https://z2m.${SECRET_DOMAIN}
          interval: 1m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
        - name: zigbee device plugin
          group: home
          # Worth watching in its own right rather than waiting for
          # Zigbee2MQTT to notice: if this DaemonSet is down the Zigbee
          # resource stops being advertised, and Zigbee2MQTT only goes red
          # once something evicts or restarts its pod.
          url: "tcp://generic-device-plugin.home-automation.svc.cluster.local:8080"
          interval: 1m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]

        # --- infrastructure outside the cluster. Reachability only: these say
        # whether the box answers, not whether it is healthy. ---
        - name: nas (nfs)
          group: infrastructure
          # Port 2049 rather than the web UI: NFS is what the cluster actually
          # depends on for the media library and every backup.
          url: "tcp://10.0.0.20:2049"
          interval: 2m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        - name: opnsense (dns)
          group: infrastructure
          url: "tcp://10.0.0.1:53"
          interval: 2m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        - name: proxmox nuc
          group: infrastructure
          # The host running this cluster. When it wedged on 2026-08-13 its web
          # UI stopped answering while the VM still served from cache, so this
          # check would have gone red before anything else did.
          url: "tcp://10.0.0.5:8006"
          interval: 2m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        - name: proxmox infra1
          group: infrastructure
          url: "tcp://10.0.0.2:8006"
          interval: 2m
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: ntfy }]
        - name: frigate
          group: infrastructure
          # The NVR, in an LXC on the NUC. Checks that the web UI answers —
          # which is not the same as "cameras are recording"; Frigate could be
          # up and blind. A real recording check would need its API and a
          # judgement about how stale is too stale.
          url: https://frigate.home.${SECRET_DOMAIN}:8971/login
          interval: 2m
          client:
            # Frigate serves a self-signed certificate on 8971; a verified
            # request gets no response at all.
            insecure: true
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: ntfy }]
        - name: internet
          group: infrastructure
          # Distinguishes "my stuff broke" from "my ISP broke" — without it every
          # outage looks the same from in here.
          url: https://1.1.1.1
          interval: 2m
          conditions: ["[STATUS] < 400"]
          alerts: [{ type: ntfy }]
