---
# Forward auth via Authentik's embedded outpost. Targets this app's own
# hand-written HTTPRoute (same namespace requirement Gateway API enforces
# for route-level policy attachment) rather than the Gateway, so apps that
# don't want this stay untouched. See kubernetes/apps/media/sonarr/app/ for
# the pattern this follows and kubernetes/apps/observability/gatus/authentik/
# for the matching Provider.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gatus-authentik
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gatus
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-For
      - X-Real-Ip
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - kind: Service
          name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - Set-Cookie
        - X-authentik-uid
        - X-authentik-username
        - X-authentik-name
        - X-authentik-email
        - X-authentik-groups
        - X-authentik-entitlements
