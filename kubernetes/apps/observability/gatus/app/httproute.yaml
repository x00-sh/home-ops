---
# Public. Gatus has no login of its own, but its status page names every
# host and service in the homelab, so it sits behind Authentik forward auth
# (../authentik/) rather than going out unauthenticated — see
# authentik-forward-auth.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "status.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: gatus
          port: 80
