---
# LAN only. Gatus has no authentication of its own, and its status page names
# every host and service in the homelab.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "status.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: gatus
          port: 80
