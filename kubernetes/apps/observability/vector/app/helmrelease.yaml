---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  chartRef:
    kind: OCIRepository
    name: vector
  interval: 1h
  values:
    defaultPodOptions:
      # Talos's log shipper runs on the host, outside Kubernetes networking,
      # and starts before Cilium does. Binding on the host means it can always
      # reach us at 127.0.0.1 without depending on cluster networking being up.
      hostNetwork: true
      # hostNetwork pods default to the node's resolver, which cannot resolve
      # cluster services — without this the Loki sink never finds its endpoint.
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      vector:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/timberio/vector
              tag: 0.57.0-alpine
            args: ["--config", "/etc/vector/vector.yaml"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: vector
        ports:
          http:
            port: 8686
          syslog:
            port: 6000
    persistence:
      config:
        type: configMap
        name: vector-config
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /vector-data-dir
