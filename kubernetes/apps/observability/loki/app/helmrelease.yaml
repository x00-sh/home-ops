---
# Log storage. SingleBinary because this is one node: the distributed modes
# exist to scale reads and writes independently across machines, and every
# component they add here would be another process competing for the same disk.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h
  timeout: 15m
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # The chart ships no default and refuses to start without one. v13/tsdb
      # is the current format; the date is simply "before any data existed".
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 2160h
        # A single misbehaving pod can otherwise fill the disk in an afternoon.
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        max_query_series: 10000
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      # Loki's own metrics; the ServiceMonitor is created below.
      analytics:
        reporting_enabled: false

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 40Gi
        storageClass: openebs-hostpath
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi

    # Everything below is the distributed topology and its caches. On one node
    # they cost memory and buy nothing, and the memcached instances in
    # particular are sized for clusters far larger than this.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # The gateway is an nginx that fronts the distributed components; with
    # SingleBinary there is a single service to talk to already.
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false

    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
