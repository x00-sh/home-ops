---
# See kubernetes/apps/media/authentik-blueprint/app/configmap.yaml for the
# pattern this follows. Grafana and Headlamp keep their own native Authentik
# OIDC login (their own authentik/ directories) rather than forward auth, so
# they gate on their own per-app groups instead of this one. This group is
# for apps using the forward-auth pattern — see
# kubernetes/apps/observability/gatus/authentik/ for the first one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-authentik-blueprint
data:
  observability.yaml: |
    version: 1
    metadata:
      name: observability-forward-auth
    entries:
      - model: authentik_core.group
        id: group-observability
        identifiers:
          name: observability
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: observability
        attrs:
          users:
            - !Find [authentik_core.user, [username, jlor]]
