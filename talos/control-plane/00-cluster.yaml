cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    # No `admissionControl: {$patch: delete}` here. Talos <=1.13 populated
    # `cluster.apiServer.admissionControl` with a default PodSecurity plugin
    # that this patch removed; Talos 1.14 deprecated `.cluster.apiServer` and
    # moved that config to the separate KubeAdmissionControlConfig document, so
    # the path no longer exists and the delete fails `just configure` with
    # "failed to delete path 'cluster.apiServer.admissionControl': lookup
    # failed". Verified the apiserver still runs with only NodeRestriction
    # enabled, i.e. nothing re-enables PodSecurity by dropping this.
    certSANs:
      - "127.0.0.1"
      - "10.0.0.50"
      - "k.x00.sh"
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.0.0.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
    config:
      profiles:
        - schedulerName: default-scheduler
          pluginConfig:
            - name: PodTopologySpread
              args:
                defaultingType: List
                defaultConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
